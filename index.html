<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON / Dict Visual Editor</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    /* Subtle dark IDE scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: #263147;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b4b6b;
    }
    /* Tree vertical guide lines */
    .tree-children-guide {
      border-left: 1px solid #1e293b;
      margin-left: 7px;
      padding-left: 14px;
    }
    /* White rendered HTML preview box (matches email/document rendering in screenshot) */
    .rendered-html-canvas {
      background: #ffffff;
      color: #111827;
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      border-radius: 4px;
      padding: 14px 16px;
      overflow-x: auto;
      max-height: 640px;
      min-height: 120px;
      resize: vertical;
      overflow-y: auto;
      word-break: break-word;
    }
    .rendered-html-canvas[contenteditable="true"]:focus {
      outline: 2px solid #38bdf8;
      outline-offset: -1px;
    }
    .rendered-html-canvas table {
      border-collapse: collapse;
      width: 100%;
      margin: 6px 0;
      font-size: 12.5px;
    }
    .rendered-html-canvas th,
    .rendered-html-canvas td {
      border: 1px solid #94a3b8;
      padding: 5px 8px;
      text-align: left;
      vertical-align: top;
    }
    .rendered-html-canvas a {
      color: #0284c7;
      text-decoration: underline;
    }
    .rendered-html-canvas p {
      margin: 0 0 8px 0;
    }
    /* Draggable Split Pane Resizer */
    .split-resizer {
      position: relative;
      width: 8px;
      background-color: #161f33;
      border-left: 1px solid #1f293d;
      border-right: 1px solid #1f293d;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      z-index: 30;
      user-select: none;
      touch-action: none;
      cursor: col-resize;
    }
    .split-resizer:hover,
    .split-resizer.is-dragging {
      background-color: #0284c7;
      border-color: #38bdf8;
    }
    .split-resizer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -6px;
      right: -6px;
    }
    body.resizing-col {
      cursor: col-resize !important;
      user-select: none !important;
    }
    body.resizing-row {
      cursor: row-resize !important;
      user-select: none !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none sm:select-auto">

  <!-- TOP HEADER BAR (Matches Screenshot) -->
  <header class="bg-[#111726] border-b border-[#1f293d] px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
    <!-- Left Brand -->
    <div class="flex items-center gap-2.5">
      <span class="text-sky-400 font-mono-code font-bold text-base tracking-tight">{ }</span>
      <h1 class="font-semibold text-[15px] text-slate-100 tracking-tight">JSON / Dict Visual Editor</h1>
    </div>

    <!-- Right Toolbar Controls -->
    <div class="flex flex-wrap items-center gap-2 text-xs">
      <!-- Sample Selector / Button -->
      <div class="inline-flex items-center rounded bg-[#1a2234] border border-[#2a3650] overflow-hidden">
        <button id="loadSampleBtn" type="button" class="px-2.5 py-1 text-slate-200 hover:bg-[#232e46] font-medium transition" title="Load default RFQ Email JSON with HTML & Base64">
          Sample
        </button>
        <button id="samplePythonDictBtn" type="button" class="px-2 py-1 text-sky-300 hover:bg-[#232e46] border-l border-[#2a3650] font-mono-code text-[11px] transition" title="Load Python Dict sample with single quotes, True & None">
          py
        </button>
      </div>

      <!-- Open File -->
      <label class="cursor-pointer px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition inline-flex items-center">
        <span>Open file</span>
        <input id="openFileInput" type="file" accept=".json,.py,.txt,.dict,application/json,text/plain" class="hidden" />
      </label>

      <!-- Output Format Select -->
      <div class="flex items-center gap-1.5 text-slate-400">
        <span>Output</span>
        <select id="outputModeSelect" class="bg-[#151c2c] border border-[#2a3650] hover:border-slate-500 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-sky-500">
          <option value="same" selected>Same as input</option>
          <option value="json">JSON</option>
          <option value="python">Python dict</option>
        </select>
      </div>

      <!-- Indent Select -->
      <div class="flex items-center gap-1.5 text-slate-400">
        <span>Indent</span>
        <select id="indentSelect" class="bg-[#151c2c] border border-[#2a3650] hover:border-slate-500 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-sky-500">
          <option value="4" selected>4 spaces</option>
          <option value="2">2 spaces</option>
          <option value="tab">Tab</option>
          <option value="0">Compact</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <button id="formatRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Format
      </button>
      <button id="resetOriginalBtn" type="button" class="px-2.5 py-1 rounded bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 font-medium transition flex items-center gap-1" title="Revert all edits back to original pasted/loaded input and reset split layout">
        <span>↺ Reset to original</span>
      </button>
      <button id="copyRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Copy
      </button>
      <button id="downloadRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Download
      </button>
      <button id="clearRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-rose-950/60 hover:border-rose-700/60 border border-[#2a3650] text-slate-200 hover:text-rose-200 font-medium transition">
        Clear
      </button>
    </div>
  </header>

  <!-- MAIN SPLIT WORKSPACE -->
  <main id="splitWorkspace" class="flex-1 flex flex-row min-h-0 overflow-hidden relative">

    <!-- LEFT PANE: INPUT (JSON or Python Dict) -->
    <section id="leftEditorPane" style="width: 44%; flex-basis: 44%;" class="h-full flex flex-col bg-[#0b0f17] shrink-0 min-w-[180px] max-w-[85%]">
      <!-- Left Pane Subheader -->
      <div class="px-3.5 py-2 bg-[#111726] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="flex flex-wrap items-center gap-2 min-w-0">
          <span class="font-bold text-xs text-slate-100">Input</span>
          <span class="text-xs text-slate-400 truncate">Paste JSON or a Python dict — edits on the right sync back here</span>
          <span id="detectedSyntaxBadge" class="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-400 border border-sky-500/30 font-mono-code font-semibold text-[10px] tracking-wide">
            JSON
          </span>
          <span id="editedStateBadge" class="hidden px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 font-mono-code font-semibold text-[10px]">
            Modified
          </span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400" title="Adjust JSON Editor width">
            <span class="hidden sm:inline">Width</span>
            <input id="editorWidthSlider" type="range" min="20" max="80" step="1" value="44" class="w-16 sm:w-20 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400" />
            <span id="editorWidthLabel" class="font-mono-code text-[10.5px] text-slate-300 w-8 text-right">44%</span>
          </div>
          <button id="resetPaneSplitBtn" type="button" class="hidden px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-[10.5px] text-slate-300 font-mono-code transition" title="Reset editor width to default (44%)">
            Reset split
          </button>
        </div>
      </div>

      <!-- Raw Code Textarea -->
      <div class="relative flex-1 min-h-0 flex flex-col">
        <textarea
          id="rawInputArea"
          spellcheck="false"
          wrap="off"
          placeholder="Paste JSON or a Python dict here..."
          class="w-full flex-1 p-3.5 bg-[#0b0f17] text-slate-100 font-mono-code text-[12.5px] leading-[1.55] focus:outline-none resize-none border-0 overflow-auto"
        ></textarea>
      </div>

      <!-- Bottom Parse Status Bar -->
      <div id="parseStatusBar" class="px-3.5 py-1.5 bg-[#0e1420] border-t border-[#1f293d] flex items-center justify-between gap-2 text-xs shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span id="parseStatusIcon" class="text-emerald-400 font-bold">✓</span>
          <span id="parseStatusText" class="text-emerald-400 truncate">Parsed successfully</span>
        </div>
        <div class="flex items-center gap-2 text-[11px] text-slate-400 shrink-0">
          <button id="autoRepairBtn" type="button" class="hidden px-2 py-0.5 rounded bg-rose-800/80 hover:bg-rose-700 text-rose-100 font-medium transition">
            Auto-fix syntax
          </button>
          <span id="statsSummaryText" class="font-mono-code text-slate-500"></span>
        </div>
      </div>
    </section>

    <!-- DRAGGABLE RESIZER DIVIDER BETWEEN INPUT & VIEWER -->
    <div
      id="paneResizer"
      role="separator"
      aria-label="Drag left or right to adjust JSON Editor width (double-click to reset)"
      title="Drag left or right to adjust JSON Editor width (Double-click to reset)"
      class="split-resizer h-full shrink-0 flex items-center justify-center group"
    >
      <div class="w-1 h-12 rounded-full bg-slate-500 group-hover:bg-white transition flex flex-col items-center justify-center gap-0.5"></div>
    </div>

    <!-- RIGHT PANE: VIEWER / EDITOR -->
    <section id="rightViewerPane" class="flex-1 h-full flex flex-col bg-[#0d121d] min-w-[200px] overflow-hidden">
      <!-- Right Pane Subheader -->
      <div class="px-3.5 py-2 bg-[#111726] border-b border-[#1f293d] flex flex-wrap items-center gap-2.5 shrink-0">
        <span class="font-bold text-xs text-slate-100 shrink-0">Viewer / Editor</span>

        <div class="relative flex-1 min-w-[160px]">
          <input
            id="searchNodesInput"
            type="text"
            placeholder="Filter keys / values..."
            class="w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 text-xs text-slate-100 placeholder-slate-500 focus:outline-none"
          />
          <button id="clearSearchBtn" type="button" class="hidden absolute right-2 top-1 text-slate-400 hover:text-slate-200 text-xs">✕</button>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="expandAllBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-xs font-medium transition">
            Expand all
          </button>
          <button id="collapseAllBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-xs font-medium transition">
            Collapse all
          </button>
        </div>
      </div>

      <!-- Scrollable Tree Container -->
      <div id="inspectorTreeContainer" class="flex-1 p-3.5 overflow-y-auto overflow-x-hidden space-y-1.5">
        <!-- Populated dynamically by JavaScript -->
      </div>
    </section>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    (function () {
      'use strict';

      // Configure PDF.js worker if loaded
      if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // =========================================================================
      // 1. UTF-8, BINARY, CSV, EXCEL & PDF <-> BASE64 UTILITIES
      // =========================================================================
      function utf8ToBase64(str) {
        try {
          const bytes = new TextEncoder().encode(str);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        } catch (e) {
          return btoa(unescape(encodeURIComponent(str)));
        }
      }

      function base64ToBytes(b64) {
        let clean = String(b64).replace(/[\r\n\s]/g, '').replace(/-/g, '+').replace(/_/g, '/');
        while (clean.length % 4 !== 0) clean += '=';
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function bytesToBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      function base64ToUtf8(b64, allowLatin1Fallback) {
        const bytes = base64ToBytes(b64);
        try {
          return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (e) {
          if (allowLatin1Fallback) {
            return new TextDecoder('iso-8859-1').decode(bytes);
          }
          throw e;
        }
      }

      // CSV Parser & Serializer (handles quoted fields, commas, newlines)
      function parseCsvToGrid(csvText, delimiter) {
        const sep = delimiter || detectCsvDelimiter(csvText);
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        const s = String(csvText).replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        for (let i = 0; i < s.length; i++) {
          const c = s[i];
          if (inQuotes) {
            if (c === '"') {
              if (s[i + 1] === '"') {
                field += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              field += c;
            }
          } else {
            if (c === '"') {
              inQuotes = true;
            } else if (c === sep) {
              row.push(field);
              field = '';
            } else if (c === '\n') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += c;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        // Normalize column count
        const maxCols = rows.reduce((m, r) => Math.max(m, r.length), 0) || 1;
        return rows.map(r => {
          while (r.length < maxCols) r.push('');
          return r;
        });
      }

      function serializeGridToCsv(grid, delimiter) {
        const sep = delimiter || ',';
        return grid.map(row =>
          row.map(cell => {
            const s = String(cell == null ? '' : cell);
            if (s.includes(sep) || s.includes('"') || s.includes('\n')) {
              return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
          }).join(sep)
        ).join('\n');
      }

      function detectCsvDelimiter(text) {
        const firstLines = String(text).split(/\r?\n/).filter(l => l.trim().length > 0).slice(0, 5);
        if (firstLines.length === 0) return ',';
        const candidates = [',', ';', '\t', '|'];
        let best = ',';
        let bestScore = 0;
        for (const cand of candidates) {
          const counts = firstLines.map(l => l.split(cand).length - 1);
          if (counts[0] > 0 && counts.every(c => c === counts[0])) {
            if (counts[0] > bestScore) {
              bestScore = counts[0];
              best = cand;
            }
          }
        }
        return best;
      }

      function isLikelyCsvText(text, hintMime, hintFileName) {
        const lowerMime = String(hintMime || '').toLowerCase();
        const lowerFile = String(hintFileName || '').toLowerCase();
        if (lowerMime.includes('csv') || lowerFile.endsWith('.csv') || lowerFile.endsWith('.tsv')) {
          return true;
        }
        if (typeof text !== 'string' || text.length < 5) return false;
        const trimmed = text.trim();
        if (trimmed.startsWith('<') || trimmed.startsWith('{') || trimmed.startsWith('[')) return false;
        const lines = trimmed.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length >= 2) {
          const sep = detectCsvDelimiter(trimmed);
          const colCounts = lines.slice(0, 10).map(l => parseCsvToGrid(l, sep)[0].length);
          if (colCounts[0] >= 2 && colCounts.every(c => c === colCounts[0])) {
            return true;
          }
        }
        // Single-line comma-separated header/list with >= 3 items (like "material reference, unit price, leadtime")
        if (lines.length === 1 && (lines[0].match(/,/g) || []).length >= 2 && lines[0].length < 300) {
          return true;
        }
        return false;
      }

      // Pure-JS Minimal Valid PDF Generator (creates a valid single-page PDF from text lines and encodes to Base64)
      function generateSimplePdfBase64(textContent) {
        const lines = String(textContent || '').replace(/\r\n/g, '\n').split('\n');
        let streamLines = ['BT', '/F1 11 Tf', '50 750 Td', '15 TL'];
        for (let i = 0; i < lines.length; i++) {
          const safe = lines[i]
            .replace(/\\/g, '\\\\')
            .replace(/\(/g, '\\(')
            .replace(/\)/g, '\\)');
          if (i === 0) streamLines.push('(' + safe + ') Tj');
          else streamLines.push("T* (" + safe + ") Tj");
        }
        streamLines.push('ET');
        const streamData = streamLines.join('\n');

        const objs = [];
        objs.push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
        objs.push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
        objs.push('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n');
        objs.push('4 0 obj\n<< /Length ' + streamData.length + ' >>\nstream\n' + streamData + '\nendstream\nendobj\n');
        objs.push('5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n');

        let pdf = '%PDF-1.4\n';
        const offsets = [];
        for (let i = 0; i < objs.length; i++) {
          offsets.push(pdf.length);
          pdf += objs[i];
        }
        const xrefPos = pdf.length;
        pdf += 'xref\n0 ' + (objs.length + 1) + '\n';
        pdf += '0000000000 65535 f \n';
        for (let i = 0; i < offsets.length; i++) {
          pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
        }
        pdf += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
        return utf8ToBase64(pdf);
      }

      // Helper to generate a sample Base64 Excel (.xlsx) workbook if SheetJS is loaded
      function createSampleExcelBase64() {
        if (!window.XLSX) return '';
        const wb = window.XLSX.utils.book_new();
        const wsData = [
          ['Material Number', 'Description', 'Plant', 'Qty', 'Unit Price', 'Currency'],
          ['21004589', 'VALVE BALL 2 INCH SS316', 'A405-KOTHUR', 12, 145.00, 'USD'],
          ['21008912', 'PRESSURE GAUGE 0-10 BAR', 'A405-KOTHUR', 6, 68.50, 'USD'],
          ['21009304', 'GASKET SPIRAL WOUND DN50', 'A405-KOTHUR', 24, 19.25, 'USD']
        ];
        const ws = window.XLSX.utils.aoa_to_sheet(wsData);
        window.XLSX.utils.book_append_sheet(wb, ws, 'Quotation_Items');
        return window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
      }

      // =========================================================================
      // 2. SAMPLE PAYLOADS (EXACT SCREENSHOT RFQ EMAIL JSON + PYTHON DICT SAMPLE)
      // =========================================================================

      function inspectBase64Value(str, keyName, parentObj) {

      function classifyCleanedBase64(rawB64, prefix, hintMime, hintFileName, hasStrongHint) {

              decodedText: decoded,

              rawB64: rawB64,
              kind: 'html',
              mime: 'text/html',
              decodedText: decoded

              prefix: prefix,

              prefix: prefix,
              rawB64: rawB64,
              kind: 'json',
              mime: 'application/json',
              decodedText: decoded

            prefix: prefix,
            rawB64: rawB64,
            kind: 'text',
            mime: mime || 'text/plain',
