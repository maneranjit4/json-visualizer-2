          return String(currentVal);
        }
        if (targetType === 'number') {
          const n = Number(currentVal);
          return Number.isFinite(n) ? n : 0;
        }
        if (targetType === 'boolean') {
          if (typeof currentVal === 'string') {
            return currentVal.trim().toLowerCase() !== 'false' && currentVal.trim() !== '0' && currentVal.trim() !== '';
          }
          return Boolean(currentVal);
        }
        if (targetType === 'null') return null;
        if (targetType === 'object') {
          if (currentVal && typeof currentVal === 'object' && !Array.isArray(currentVal)) return currentVal;
          return {};
        }
        if (targetType === 'array') {
          if (Array.isArray(currentVal)) return currentVal;
          return [];
        }
        return currentVal;
      }

      function getValueTypeName(val) {
        if (val === null || val === undefined) return 'null';
        if (Array.isArray(val)) return 'array';
        return typeof val; // 'object' | 'string' | 'number' | 'boolean'
      }

      // =========================================================================
      // 7. DOM REFERENCES & TWO-WAY SYNC
      // =========================================================================
      const rawInputArea = document.getElementById('rawInputArea');
      const detectedSyntaxBadge = document.getElementById('detectedSyntaxBadge');
      const parseStatusIcon = document.getElementById('parseStatusIcon');
      const parseStatusText = document.getElementById('parseStatusText');
      const autoRepairBtn = document.getElementById('autoRepairBtn');
      const statsSummaryText = document.getElementById('statsSummaryText');
      const inspectorTreeContainer = document.getElementById('inspectorTreeContainer');
      const outputModeSelect = document.getElementById('outputModeSelect');
      const indentSelect = document.getElementById('indentSelect');

      function updateTopBadgesAndStatus(ok, errorMessage) {
        const effectiveFmt = getEffectiveOutputFormat();
        detectedSyntaxBadge.textContent = effectiveFmt === 'python' ? 'PYTHON DICT' : 'JSON';

        if (ok) {
          parseStatusIcon.textContent = '✓';
          parseStatusIcon.className = 'text-emerald-400 font-bold';
          parseStatusText.textContent = 'Parsed successfully';
          parseStatusText.className = 'text-emerald-400 truncate';
          autoRepairBtn.classList.add('hidden');
        } else {
          parseStatusIcon.textContent = '✕';
          parseStatusIcon.className = 'text-rose-400 font-bold';
          parseStatusText.textContent = errorMessage || 'Syntax error';
          parseStatusText.className = 'text-rose-400 truncate font-mono-code';
          autoRepairBtn.classList.remove('hidden');
        }
      }

      /**
       * Syncs edits from the Right Pane (`state.data`) back to the Left Pane (`rawInputArea`).
       * If `reRenderTree` is false, keeps the current DOM focus intact for smooth typing!
       */
      function syncRightToLeft(reRenderTree, markAsOriginal) {
        const serialized = serializeCurrentData(state.data);
        rawInputArea.value = serialized;
        if (markAsOriginal) {
          saveOriginalSnapshot(serialized, state.data, state.detectedInputFormat);
        } else if (state.originalDataClone !== null) {
          state.isModifiedFromOriginal = JSON.stringify(state.data) !== JSON.stringify(state.originalDataClone);
          updateModifiedBadge();
        }
        updateTopBadgesAndStatus(true);
        if (reRenderTree) {
          renderTree();
        }
      }

      /**
       * Parses edits made directly in the Left Pane (`rawInputArea`) and updates the Right Pane tree.
       * When the user pastes or types a new valid JSON/dict in Input, we also capture it as the baseline original if none was edited yet or on paste.
       */
      function handleLeftInputChanged(captureAsOriginal) {
        const res = parseJsonOrPythonDict(rawInputArea.value);
        if (!res.ok) {
          updateTopBadgesAndStatus(false, res.error);
          return;
        }
        state.data = res.value;
        state.detectedInputFormat = res.detectedFormat;
        if (captureAsOriginal || state.originalDataClone === null) {
          saveOriginalSnapshot(rawInputArea.value, res.value, res.detectedFormat);
        } else {
          state.isModifiedFromOriginal = JSON.stringify(state.data) !== JSON.stringify(state.originalDataClone);
          updateModifiedBadge();
        }
        updateTopBadgesAndStatus(true);
        renderTree();
      }

      // =========================================================================
      // 8. TREE VIEW / VISUAL EDITOR RENDERING (MATCHING SCREENSHOT LAYOUT)
      // =========================================================================
      function nodeMatchesSearch(key, val, pathArr) {
        if (!state.searchQuery) return true;
        const q = state.searchQuery.toLowerCase();
        if (String(key).toLowerCase().includes(q)) return true;
        if (typeof val === 'string') {
          if (val.toLowerCase().includes(q)) return true;
          const b64 = inspectBase64Value(val, key);
          if (b64.isBase64 && b64.decodedText && b64.decodedText.toLowerCase().includes(q)) return true;
        } else if (val !== null && typeof val !== 'object') {
          if (String(val).toLowerCase().includes(q)) return true;
        }
        return false;
      }

      function subtreeMatchesSearch(val, pathArr) {
        if (!state.searchQuery) return true;
        if (val && typeof val === 'object') {
          for (const k of Object.keys(val)) {
            const childPath = pathArr.concat([k]);
            if (nodeMatchesSearch(k, val[k], childPath) || subtreeMatchesSearch(val[k], childPath)) {
              return true;
            }
          }
        }
        return false;
      }

      function renderTree() {
        inspectorTreeContainer.innerHTML = '';
        if (state.data === undefined) return;

        const rootNode = buildTreeRow('root', state.data, [], false, true);
        inspectorTreeContainer.appendChild(rootNode);
      }

      function buildTypeSelectDropdown(currentType, pathArr, keyLabel, val) {
        const sel = document.createElement('select');
        sel.className = 'bg-[#161f30] hover:bg-[#1e2940] border border-[#2a3650] rounded px-1.5 py-0.5 text-[11.5px] font-mono-code text-slate-200 focus:outline-none focus:border-sky-500 shrink-0 cursor-pointer';

        // Also allow switching string sub-mode (HTML / Base64) right from a dedicated pill or type menu
        const baseTypes = ['string', 'number', 'boolean', 'null', 'object', 'array'];
        baseTypes.forEach(function (t) {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          if (t === currentType) opt.selected = true;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', function () {
          const nextType = sel.value;
          const converted = convertValueToType(val, nextType);
          setValueAtPath(state.data, pathArr, converted);
          syncRightToLeft(true);
        });

        return sel;
      }

      function buildTreeRow(key, val, pathArr, parentIsArray, isRoot) {
        const pKey = pathKey(pathArr);
        const ui = getNodeUi(pKey);
        const vType = getValueTypeName(val);
        const isContainer = vType === 'object' || vType === 'array';
        const isArray = vType === 'array';
        const isCollapsed = state.collapsedPaths.has(pKey);

        const wrapper = document.createElement('div');
        wrapper.className = 'w-full';

        // Row Header / Main Line
        const row = document.createElement('div');
        row.className = 'group flex items-start gap-2 py-1 rounded hover:bg-slate-800/25 transition px-1';

        // 1. Collapse Caret (for containers) or spacer
        if (isContainer) {
          const caretBtn = document.createElement('button');
          caretBtn.type = 'button';
          caretBtn.className = 'w-4 h-5 flex items-center justify-center text-slate-400 hover:text-slate-100 text-[11px] shrink-0 mt-0.5';
          caretBtn.textContent = isCollapsed ? '▸' : '▾';
          caretBtn.addEventListener('click', function () {
            if (state.collapsedPaths.has(pKey)) state.collapsedPaths.delete(pKey);
            else state.collapsedPaths.add(pKey);
            renderTree();
          });
          row.appendChild(caretBtn);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'w-1 shrink-0';
          row.appendChild(spacer);
        }

        // 2. Key Name (or root / array index)
        if (isRoot) {
          const rootLbl = document.createElement('span');
          rootLbl.className = 'font-mono-code text-xs text-slate-300 font-medium mt-1 shrink-0';
          rootLbl.textContent = 'root';
          row.appendChild(rootLbl);
        } else if (parentIsArray) {
          const idxLbl = document.createElement('span');
          idxLbl.className = 'font-mono-code text-xs text-sky-400/80 min-w-[36px] mt-1 shrink-0';
          idxLbl.textContent = String(key);
          row.appendChild(idxLbl);
        } else {
          const keyInput = document.createElement('input');
          keyInput.type = 'text';
          keyInput.value = String(key);
          keyInput.title = 'Click to edit key name';
          keyInput.className = 'w-[125px] sm:w-[140px] bg-transparent hover:bg-[#161f30] focus:bg-[#0b0f17] border border-transparent focus:border-sky-500 rounded px-1 py-0.5 font-mono-code text-xs text-sky-400 font-medium focus:outline-none shrink-0 mt-0.5';
          keyInput.addEventListener('change', function () {
            const nextK = keyInput.value.trim();
            if (nextK && nextK !== key) {
              if (renameKeyAtPath(state.data, pathArr, nextK)) {
                syncRightToLeft(true);
              }
            } else {
              keyInput.value = String(key);
            }
          });
          row.appendChild(keyInput);
        }

        // 3. Colon ':'
        const colon = document.createElement('span');
        colon.className = 'font-mono-code text-xs text-slate-500 mt-1 shrink-0';
        colon.textContent = ':';
        row.appendChild(colon);

        // 4. Type Select Dropdown (`object ▾`, `string ▾`, etc.)
        const typeSelect = buildTypeSelectDropdown(vType, pathArr, key, val);
        typeSelect.classList.add('mt-0.5');
        row.appendChild(typeSelect);

        // 5. Value Slot or Container Summary
        if (isContainer) {
          const count = isArray ? val.length : Object.keys(val).length;
          const summarySpan = document.createElement('span');
          summarySpan.className = 'font-mono-code text-xs text-slate-400 mt-1 cursor-pointer select-none';
          summarySpan.textContent = isArray
            ? '[ ' + count + (count === 1 ? ' item ]' : ' items ]')
            : '{ ' + count + (count === 1 ? ' key }' : ' keys }');
          summarySpan.addEventListener('click', function () {
            if (state.collapsedPaths.has(pKey)) state.collapsedPaths.delete(pKey);
            else state.collapsedPaths.add(pKey);
            renderTree();
          });
          row.appendChild(summarySpan);

          // Add property / item button
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'opacity-80 group-hover:opacity-100 ml-1 mt-0.5 px-2 py-0.5 rounded bg-[#162032] hover:bg-[#1f2e47] border border-[#2a3650] text-[11px] font-mono-code text-sky-300 transition';
          addBtn.textContent = isArray ? '+ item' : '+ key';
          addBtn.addEventListener('click', function () {
            if (isArray) {
              val.push('');
            } else {
              let idx = Object.keys(val).length + 1;
              while (Object.prototype.hasOwnProperty.call(val, 'new_key_' + idx)) idx++;
              val['new_key_' + idx] = '';
            }
            state.collapsedPaths.delete(pKey);
            syncRightToLeft(true);
          });
          row.appendChild(addBtn);

          if (!isRoot) {
            const delBtn = buildDeleteRowButton(pathArr, key);
            row.appendChild(delBtn);
          }

          wrapper.appendChild(row);

          // Render children inside vertical guide line if expanded
          if (!isCollapsed) {
            const childrenBox = document.createElement('div');
            childrenBox.className = 'tree-children-guide space-y-1 mt-1';
            const entries = Object.entries(val);
            for (let i = 0; i < entries.length; i++) {
              const [cKey, cVal] = entries[i];
              const cPath = pathArr.concat([cKey]);
              const cIsContainer = cVal !== null && typeof cVal === 'object';
              if (!nodeMatchesSearch(cKey, cVal, cPath) && !(cIsContainer && subtreeMatchesSearch(cVal, cPath))) {
                continue;
              }
              childrenBox.appendChild(buildTreeRow(cKey, cVal, cPath, isArray, false));
            }
            wrapper.appendChild(childrenBox);
          }
        } else {
          // Primitive Value Slot (stretches across remaining width just like screenshot)
          const valueSlot = document.createElement('div');
          valueSlot.className = 'flex-1 min-w-0 flex items-start gap-1.5';

          const editorEl = buildLeafValueSlot(key, val, pathArr, ui);
          valueSlot.appendChild(editorEl);

          row.appendChild(valueSlot);
          wrapper.appendChild(row);
        }

        return wrapper;
      }

      function buildDeleteRowButton(pathArr, key) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.title = 'Remove "' + key + '"';
        btn.className = 'opacity-0 group-hover:opacity-100 focus:opacity-100 px-1.5 py-0.5 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-950/40 text-xs font-mono-code transition shrink-0 mt-0.5';
        btn.textContent = '×';
        btn.addEventListener('click', function () {
          deleteAtPath(state.data, pathArr);
          syncRightToLeft(true);
        });
        return btn;
      }

      // =========================================================================
      // 9. LEAF VALUE EDITORS (STRING / HTML CARD / BASE64 CARD / NUMBER / BOOL)
      // =========================================================================
      function buildLeafValueSlot(key, val, pathArr, ui) {
        if (typeof val === 'string') {
          const parentObj = pathArr.length > 1 ? getValueAtPath(state.data, pathArr.slice(0, -1)) : state.data;
          const b64Info = inspectBase64Value(val, key, parentObj);
          const isB64 = ui.forceMode === 'base64' || (ui.forceMode !== 'plain' && ui.forceMode !== 'html' && b64Info.isBase64);
          const isHtml = !isB64 && (ui.forceMode === 'html' || (ui.forceMode !== 'plain' && isHtmlValue(val)));

          if (isB64) {
            return buildBase64ValueCard(key, val, b64Info, pathArr, ui);
          }
          if (isHtml) {
            return buildHtmlValueCard(val, pathArr, ui, function (newHtml) {
              setValueAtPath(state.data, pathArr, newHtml);
              syncRightToLeft(false);
            }, 'HTML');
          }
          return buildPlainStringTextarea(key, val, pathArr, ui);
        }

        if (typeof val === 'number') {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.step = 'any';
          inp.value = String(val);
          inp.className = 'w-44 bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-amber-300 focus:outline-none';
          inp.addEventListener('input', function () {
            const n = Number(inp.value);
            if (!Number.isNaN(n)) {
              setValueAtPath(state.data, pathArr, n);
              syncRightToLeft(false);
            }
          });
          return inp;
        }

        if (typeof val === 'boolean') {
          const sel = document.createElement('select');
          sel.className = 'bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-emerald-300 focus:outline-none';
          const isPy = getEffectiveOutputFormat() === 'python';
          [true, false].forEach(function (b) {
            const o = document.createElement('option');
            o.value = String(b);
            o.textContent = isPy ? (b ? 'True' : 'False') : (b ? 'true' : 'false');
            if (b === val) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener('change', function () {
            setValueAtPath(state.data, pathArr, sel.value === 'true');
            syncRightToLeft(false);
          });
          return sel;
        }

        // null / None
        const nullBadge = document.createElement('span');
        nullBadge.className = 'inline-block px-2.5 py-1 rounded bg-[#111726] border border-[#263248] font-mono-code text-xs text-slate-400 italic';
        nullBadge.textContent = getEffectiveOutputFormat() === 'python' ? 'None' : 'null';
        return nullBadge;
      }

      /**
       * Plain string resizable textarea (matches screenshot's `to`, `cc`, `from`, `subject`, `messageID`, `webLink` rows)
       */
      function buildPlainStringTextarea(key, strVal, pathArr, ui) {
        const container = document.createElement('div');
        container.className = 'flex-1 min-w-0 flex items-start';

        const ta = document.createElement('textarea');
        const lineCount = strVal.split('\n').length;
        const estimatedRows = lineCount > 1 ? Math.min(4, lineCount) : (strVal.length > 140 ? 3 : (strVal.length > 75 ? 2 : 1));
        ta.rows = estimatedRows;
        ta.spellcheck = false;
        ta.value = strVal;
        ta.className = 'flex-1 w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-slate-100 leading-snug focus:outline-none resize-y min-h-[28px]';

        ta.addEventListener('input', function () {
          setValueAtPath(state.data, pathArr, ta.value);
          syncRightToLeft(false);
        });

        container.appendChild(ta);
        return container;
      }

      /**
       * Exact HTML Value Card from Screenshot:
       * - Top bar: `HTML` badge on left | `Rendered` (active blue) & `Source` buttons on right
       * - Sub-bar: `[✓] Edit visually` checkbox + `Scripts are disabled in the preview for safety.`
       * - White document canvas below where user can edit visually (`contenteditable`) and sync back to JSON/dict!
       */
      function buildHtmlValueCard(htmlStr, pathArr, ui, onHtmlChanged, badgeLabel) {
        const card = document.createElement('div');
        card.className = 'flex-1 w-full rounded-md border border-[#263248] bg-[#101726] overflow-hidden';

        const activeTab = ui.htmlTab || 'rendered';

        // Header Bar
        const header = document.createElement('div');
        header.className = 'px-2.5 py-1.5 bg-[#141d30] border-b border-[#222d44] flex items-center justify-between gap-2';

        const leftBadges = document.createElement('div');
        leftBadges.className = 'flex items-center gap-2';

        const htmlBadge = document.createElement('span');
        htmlBadge.className = 'px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30 font-mono-code font-bold text-[10.5px] tracking-wide';
        htmlBadge.textContent = badgeLabel || 'HTML';
        leftBadges.appendChild(htmlBadge);

        header.appendChild(leftBadges);

        // Right Toggle: Rendered | Source
        const tabGroup = document.createElement('div');
        tabGroup.className = 'inline-flex items-center rounded bg-[#0d1320] p-0.5 border border-[#263248] text-xs';

        const renderedBtn = document.createElement('button');
        renderedBtn.type = 'button';
        renderedBtn.className = activeTab === 'rendered'
          ? 'px-2.5 py-0.5 rounded bg-sky-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        renderedBtn.textContent = 'Rendered';
        renderedBtn.addEventListener('click', function () {
          ui.htmlTab = 'rendered';
          renderTree();
        });

        const sourceBtn = document.createElement('button');
        sourceBtn.type = 'button';
        sourceBtn.className = activeTab === 'source'
          ? 'px-2.5 py-0.5 rounded bg-sky-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        sourceBtn.textContent = 'Source';
        sourceBtn.addEventListener('click', function () {
          ui.htmlTab = 'source';
          renderTree();
        });

        tabGroup.appendChild(renderedBtn);
        tabGroup.appendChild(sourceBtn);
        header.appendChild(tabGroup);
        card.appendChild(header);

        if (activeTab === 'rendered') {
          // Sub-bar with `[✓] Edit visually` checkbox + `Scripts are disabled in the preview for safety.`
          const subBar = document.createElement('div');
          subBar.className = 'px-2.5 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center gap-2.5 text-xs';

          const chkLabel = document.createElement('label');
          chkLabel.className = 'inline-flex items-center gap-1.5 text-slate-200 font-medium cursor-pointer select-none text-[11.5px]';

          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = ui.editVisually !== false;
          chk.className = 'rounded border-slate-600 text-sky-500 focus:ring-0 cursor-pointer';
          chkLabel.appendChild(chk);

          const chkSpan = document.createElement('span');
          chkSpan.textContent = 'Edit visually';
          chkLabel.appendChild(chkSpan);
          subBar.appendChild(chkLabel);

          const safetyNote = document.createElement('span');
          safetyNote.className = 'text-slate-400 text-[11px]';
          safetyNote.textContent = 'Scripts are disabled in the preview for safety.';
          subBar.appendChild(safetyNote);

          card.appendChild(subBar);

          // White Rendered HTML Canvas
          const canvasWrap = document.createElement('div');
          canvasWrap.className = 'p-2.5 bg-[#0d1320]';

          const surface = document.createElement('div');
          surface.className = 'rendered-html-canvas';
          surface.contentEditable = chk.checked ? 'true' : 'false';
          surface.innerHTML = sanitizeHtmlForPreview(htmlStr);

          chk.addEventListener('change', function () {
            ui.editVisually = chk.checked;
            surface.contentEditable = chk.checked ? 'true' : 'false';
            if (chk.checked) surface.focus();
          });

          surface.addEventListener('input', function () {
            onHtmlChanged(surface.innerHTML);
          });

          canvasWrap.appendChild(surface);
          card.appendChild(canvasWrap);
        } else {
          // Source Code Mode
          const srcWrap = document.createElement('div');
          srcWrap.className = 'p-2.5 bg-[#0b0f17]';

          const srcArea = document.createElement('textarea');
          srcArea.rows = 6;
          srcArea.spellcheck = false;
          srcArea.value = htmlStr;
          srcArea.className = 'w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded p-2.5 font-mono-code text-xs text-sky-100 leading-relaxed focus:outline-none resize-y';
          srcArea.addEventListener('input', function () {
            onHtmlChanged(srcArea.value);
          });

          srcWrap.appendChild(srcArea);
          card.appendChild(srcWrap);
        }

        return card;
      }

      /**
       * Base64 Value Card:
       * Automatically decodes Base64 strings (`contentBytes`, Base64 HTML, Base64 JSON, or Base64 Images)
       * and lets the user edit the decoded content visually or as text, re-encoding back to Base64 live!
       */
      function buildBase64ValueCard(key, rawVal, b64Info, pathArr, ui) {
        const card = document.createElement('div');
        card.className = 'flex-1 w-full rounded-md border border-emerald-500/35 bg-[#0e1922] overflow-hidden';

        const prefix = b64Info.isBase64 ? b64Info.prefix : '';
        const activeTab = ui.b64Tab || 'decoded';
        const kind = b64Info.isBase64 ? b64Info.kind : 'text';
        const subKind = kind.toUpperCase();

        // Header Bar
        const header = document.createElement('div');
        header.className = 'px-2.5 py-1.5 bg-[#12222f] border-b border-emerald-500/25 flex flex-wrap items-center justify-between gap-2';

        const leftBadges = document.createElement('div');
        leftBadges.className = 'flex items-center gap-1.5';

        const b64Badge = document.createElement('span');
        b64Badge.className = 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/35 font-mono-code font-bold text-[10.5px] tracking-wide';
        b64Badge.textContent = 'BASE64 • ' + subKind;
        leftBadges.appendChild(b64Badge);

        if (kind !== 'image') {
          const syncHint = document.createElement('span');
          syncHint.className = 'text-[11px] text-emerald-200/75 hidden sm:inline';
          syncHint.textContent = 'Edits auto-encode back to Base64';
          leftBadges.appendChild(syncHint);
        }

        header.appendChild(leftBadges);

        // Right Toggle Buttons depending on kind (CSV / Excel / PDF / HTML / Image / Text)
        const tabGroup = document.createElement('div');
        tabGroup.className = 'inline-flex flex-wrap items-center rounded bg-[#0b131c] p-0.5 border border-emerald-500/30 text-xs gap-0.5';

        function addTabBtn(id, label) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = activeTab === id
            ? 'px-2.5 py-0.5 rounded bg-emerald-500 text-slate-950 font-semibold text-[11.5px] transition'
            : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
          btn.textContent = label;
          btn.addEventListener('click', function () {
            ui.b64Tab = id;
            renderTree();
          });
          tabGroup.appendChild(btn);
        }

        if (kind === 'csv') {
          addTabBtn('decoded', 'Table View');
          addTabBtn('csv_source', 'CSV Text');
        } else if (kind === 'excel') {
          addTabBtn('decoded', 'Spreadsheet');
          addTabBtn('excel_csv', 'CSV Text');
        } else if (kind === 'pdf') {
          addTabBtn('decoded', 'PDF Preview');
          addTabBtn('pdf_text', 'Edit PDF Text');
        } else if (kind === 'html') {
          addTabBtn('decoded', 'Decoded HTML');
        } else if (kind === 'image') {
          addTabBtn('decoded', 'Image Preview');
        } else {
          addTabBtn('decoded', 'Decoded');
        }

        addTabBtn('raw', 'Base64');

        const plainModeBtn = document.createElement('button');
        plainModeBtn.type = 'button';
        plainModeBtn.title = 'Treat as plain string instead of Base64';
        plainModeBtn.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-slate-200 text-[11px] transition';
        plainModeBtn.textContent = 'Plain';
        plainModeBtn.addEventListener('click', function () {
          ui.forceMode = 'plain';
          renderTree();
        });
        tabGroup.appendChild(plainModeBtn);

        header.appendChild(tabGroup);
        card.appendChild(header);

        // Helper to re-encode edited decoded text back into Base64 and sync to left input
        function updateDecodedContent(newDecodedStr) {
          const encoded = prefix + utf8ToBase64(newDecodedStr);
          setValueAtPath(state.data, pathArr, encoded);
          syncRightToLeft(false);
        }

        function updateRawBase64Content(newRawB64) {
          const finalStr = prefix + newRawB64;
          setValueAtPath(state.data, pathArr, finalStr);
          syncRightToLeft(false);
        }

        // TAB: RAW BASE64
        if (activeTab === 'raw') {
          const rawBox = document.createElement('div');
          rawBox.className = 'p-2.5 bg-[#0b0f17] space-y-1';
          const rawTa = document.createElement('textarea');
          rawTa.rows = 4;
          rawTa.spellcheck = false;
          rawTa.value = rawVal;
          rawTa.className = 'w-full bg-[#0b0f17] border border-[#263248] focus:border-emerald-500 rounded p-2 font-mono-code text-xs text-slate-200 focus:outline-none resize-y';
          rawTa.addEventListener('input', function () {
            setValueAtPath(state.data, pathArr, rawTa.value.trim());
            syncRightToLeft(false);
          });
          rawBox.appendChild(rawTa);
          card.appendChild(rawBox);
          return card;
        }

        // =====================================================================
        // CASE A: BASE64 CSV (Editable Table View + CSV Text View)
        // =====================================================================
        if (b64Info.isBase64 && kind === 'csv') {
          const csvText = b64Info.decodedText || '';
          const sep = detectCsvDelimiter(csvText);

          if (activeTab === 'csv_source') {
            const bodyWrap = document.createElement('div');
            bodyWrap.className = 'p-2.5 bg-[#0b111b] space-y-1.5';
            const ta = document.createElement('textarea');
            ta.rows = Math.min(14, Math.max(4, csvText.split('\n').length));
            ta.spellcheck = false;
            ta.value = csvText;
            ta.className = 'w-full bg-[#070b12] border border-emerald-500/35 focus:border-emerald-400 rounded px-3 py-2 font-mono-code text-[13px] text-emerald-100 leading-relaxed focus:outline-none resize-y';
            ta.addEventListener('input', function () {
              b64Info.decodedText = ta.value;
              updateDecodedContent(ta.value);
            });
            bodyWrap.appendChild(ta);
            card.appendChild(bodyWrap);
            return card;
          }

          // Interactive Editable CSV Table View
          const grid = parseCsvToGrid(csvText, sep);
          card.appendChild(buildEditableSpreadsheetGrid(grid, function (updatedGrid) {
            const newCsv = serializeGridToCsv(updatedGrid, sep);
            b64Info.decodedText = newCsv;
            updateDecodedContent(newCsv);
          }, 'CSV Table (Click any cell to edit — syncs back to Base64)'));
          return card;
        }

        // =====================================================================
        // CASE B: BASE64 EXCEL (.xlsx / .xls via SheetJS)
        // =====================================================================
        if (b64Info.isBase64 && kind === 'excel' && b64Info.workbook && window.XLSX) {
          const wb = b64Info.workbook;
          const sheetNames = wb.SheetNames || [];
          const activeSheetName = (ui.activeSheet && sheetNames.includes(ui.activeSheet))
            ? ui.activeSheet
            : (sheetNames[0] || 'Sheet1');
          const ws = wb.Sheets[activeSheetName];
          const aoa = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          const grid = aoa.length > 0 ? aoa : [['']];
          const maxCols = grid.reduce((m, r) => Math.max(m, r.length), 1);
          grid.forEach(r => { while (r.length < maxCols) r.push(''); });

          // Sheet selector bar if multiple sheets or to download .xlsx
          const sheetBar = document.createElement('div');
          sheetBar.className = 'px-3 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 text-xs';

          const sheetTabs = document.createElement('div');
          sheetTabs.className = 'flex flex-wrap items-center gap-1';
          const sheetLbl = document.createElement('span');
          sheetLbl.className = 'text-slate-400 text-[11px] mr-1';
          sheetLbl.textContent = 'Sheet:';
          sheetTabs.appendChild(sheetLbl);

          sheetNames.forEach(function (sName) {
            const sBtn = document.createElement('button');
            sBtn.type = 'button';
            sBtn.className = sName === activeSheetName
              ? 'px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/40 font-mono-code text-[11px] font-semibold'
              : 'px-2 py-0.5 rounded bg-[#162032] text-slate-300 hover:text-white font-mono-code text-[11px]';
            sBtn.textContent = sName;
            sBtn.addEventListener('click', function () {
              ui.activeSheet = sName;
              renderTree();
            });
            sheetTabs.appendChild(sBtn);
          });
          sheetBar.appendChild(sheetTabs);

          const dlXlsxBtn = document.createElement('button');
          dlXlsxBtn.type = 'button';
          dlXlsxBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-[11px]';
          dlXlsxBtn.textContent = '⬇ Download .xlsx';
          dlXlsxBtn.addEventListener('click', function () {
            const outB64 = window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            const bytes = base64ToBytes(outB64);
            const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (key || 'workbook') + '.xlsx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          });
          sheetBar.appendChild(dlXlsxBtn);
          card.appendChild(sheetBar);

          if (activeTab === 'excel_csv') {
            const csvFromSheet = window.XLSX.utils.sheet_to_csv(ws);
            const bodyWrap = document.createElement('div');
            bodyWrap.className = 'p-2.5 bg-[#0b111b] space-y-1.5';
            const ta = document.createElement('textarea');
            ta.rows = Math.min(14, Math.max(4, csvFromSheet.split('\n').length));
            ta.spellcheck = false;
            ta.value = csvFromSheet;
            ta.className = 'w-full bg-[#070b12] border border-emerald-500/35 focus:border-emerald-400 rounded px-3 py-2 font-mono-code text-[13px] text-emerald-100 leading-relaxed focus:outline-none resize-y';
            ta.addEventListener('input', function () {
              const parsedGrid = parseCsvToGrid(ta.value, ',');
              wb.Sheets[activeSheetName] = window.XLSX.utils.aoa_to_sheet(parsedGrid);
              const newExcelB64 = window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
              updateRawBase64Content(newExcelB64);
            });
            bodyWrap.appendChild(ta);
            card.appendChild(bodyWrap);
            return card;
          }

          card.appendChild(buildEditableSpreadsheetGrid(grid, function (updatedGrid) {
            wb.Sheets[activeSheetName] = window.XLSX.utils.aoa_to_sheet(updatedGrid);
            const newExcelB64 = window.XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            updateRawBase64Content(newExcelB64);
          }, 'Excel Workbook (Edit any cell — re-encodes .xlsx to Base64 live)'));
          return card;
        }

        // =====================================================================
        // CASE C: BASE64 PDF (Rendered via PDF.js onto Canvas + Editable Text)
        // =====================================================================
        if (b64Info.isBase64 && kind === 'pdf') {
          const pdfContainer = document.createElement('div');
          pdfContainer.className = 'bg-[#0d1320] flex flex-col';

          let zoomPct = ui.pdfZoomPct || 125;
          const toolbar = document.createElement('div');
          toolbar.className = 'px-3 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 text-xs';

          const statusSpan = document.createElement('span');
          statusSpan.className = 'text-slate-300 font-mono-code text-[11px]';
          statusSpan.textContent = 'PDF Document';
          toolbar.appendChild(statusSpan);

          const rightCtrls = document.createElement('div');
          rightCtrls.className = 'flex items-center gap-1.5';

          const zoomOutBtn = document.createElement('button');
          zoomOutBtn.type = 'button';
          zoomOutBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomOutBtn.textContent = '−';

          const zoomLbl = document.createElement('span');
          zoomLbl.className = 'font-mono-code text-[11px] text-slate-200 min-w-[42px] text-center';
          zoomLbl.textContent = zoomPct + '%';

          const zoomInBtn = document.createElement('button');
          zoomInBtn.type = 'button';
          zoomInBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomInBtn.textContent = '+';

          const dlPdfBtn = document.createElement('button');
          dlPdfBtn.type = 'button';
          dlPdfBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-[11px]';
          dlPdfBtn.textContent = '⬇ Download PDF';
          dlPdfBtn.addEventListener('click', function () {
            const bytes = base64ToBytes(b64Info.rawB64);
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (key || 'document') + '.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          });

          rightCtrls.appendChild(zoomOutBtn);
          rightCtrls.appendChild(zoomLbl);
          rightCtrls.appendChild(zoomInBtn);
          rightCtrls.appendChild(dlPdfBtn);
          toolbar.appendChild(rightCtrls);
          pdfContainer.appendChild(toolbar);

          const pagesViewport = document.createElement('div');
          pagesViewport.className = 'p-3 overflow-auto max-h-[720px] resize-y bg-[#0b0f17] flex flex-col items-center gap-3';

          const extractedTextHolder = { text: ui.cachedPdfText || '' };

          function renderPdfPages() {
            pagesViewport.innerHTML = '<div class="text-xs text-slate-400 py-6 font-mono-code">Rendering PDF pages...</div>';
            if (!window.pdfjsLib) {
              pagesViewport.innerHTML = '<div class="text-xs text-amber-300 py-4">PDF.js library loading...</div>';
              return;
            }
            const bytes = base64ToBytes(b64Info.rawB64);
            const loadingTask = window.pdfjsLib.getDocument({ data: bytes });
            loadingTask.promise.then(function (pdfDoc) {
              pagesViewport.innerHTML = '';
              statusSpan.textContent = 'PDF Document • ' + pdfDoc.numPages + (pdfDoc.numPages === 1 ? ' page' : ' pages');
              const scale = (zoomPct / 100) * 1.35;
              const pageTextPromises = [];

              for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const pageCanvas = document.createElement('canvas');
                pageCanvas.className = 'bg-white rounded shadow-lg max-w-full h-auto border border-slate-300';
                pagesViewport.appendChild(pageCanvas);

                pageTextPromises.push(
                  pdfDoc.getPage(pageNum).then(function (page) {
                    const viewport = page.getViewport({ scale: scale });
                    const ctx = pageCanvas.getContext('2d');
                    pageCanvas.width = viewport.width;
                    pageCanvas.height = viewport.height;
                    page.render({ canvasContext: ctx, viewport: viewport });
                    return page.getTextContent().then(function (tc) {
                      return tc.items.map(item => item.str).join(' ');
                    });
                  })
                );
              }

              Promise.all(pageTextPromises).then(function (pageTexts) {
                const joined = pageTexts.join('\n\n').trim();
                if (joined && !ui.cachedPdfText) {
                  ui.cachedPdfText = joined;
                  extractedTextHolder.text = joined;
                }
              });
            }).catch(function (err) {
              pagesViewport.innerHTML = '<div class="p-4 text-xs text-rose-300 font-mono-code">Could not render PDF preview: ' + String(err && err.message ? err.message : err) + '</div>';
            });
          }

          if (activeTab === 'pdf_text') {
            const editWrap = document.createElement('div');
            editWrap.className = 'p-3 bg-[#0b111b] space-y-2';
            const note = document.createElement('div');
            note.className = 'text-[11.5px] text-emerald-300 flex items-center justify-between';
            note.innerHTML = '<span>Edit PDF text below — automatically generates a new PDF and updates Base64 in JSON/dict:</span>';
            editWrap.appendChild(note);

            const ta = document.createElement('textarea');
            ta.rows = 10;
            ta.spellcheck = false;
            ta.value = ui.cachedPdfText || 'Loading extracted PDF text...';
            ta.className = 'w-full bg-[#070b12] border border-emerald-500/35 focus:border-emerald-400 rounded px-3 py-2 font-mono-code text-[13px] text-emerald-100 leading-relaxed focus:outline-none resize-y';

            // If cachedPdfText isn't populated yet, extract it via PDF.js
            if (!ui.cachedPdfText && window.pdfjsLib) {
              try {
                const bytes = base64ToBytes(b64Info.rawB64);
                window.pdfjsLib.getDocument({ data: bytes }).promise.then(function (pdfDoc) {
                  const promises = [];
                  for (let p = 1; p <= pdfDoc.numPages; p++) {
                    promises.push(pdfDoc.getPage(p).then(pg => pg.getTextContent().then(tc => tc.items.map(i => i.str).join(' '))));
                  }
                  Promise.all(promises).then(function (texts) {
                    ui.cachedPdfText = texts.join('\n\n');
                    if (document.activeElement !== ta) ta.value = ui.cachedPdfText;
                  });
                });
              } catch (e) {}
            }

            ta.addEventListener('input', function () {
              ui.cachedPdfText = ta.value;
              const newPdfB64 = generateSimplePdfBase64(ta.value);
              b64Info.rawB64 = newPdfB64;
              updateRawBase64Content(newPdfB64);
            });

            editWrap.appendChild(ta);
            pdfContainer.appendChild(editWrap);
            card.appendChild(pdfContainer);
            return card;
          }

          zoomOutBtn.addEventListener('click', function () {
            zoomPct = Math.max(50, zoomPct - 25);
            ui.pdfZoomPct = zoomPct;
            zoomLbl.textContent = zoomPct + '%';
            renderPdfPages();
          });
          zoomInBtn.addEventListener('click', function () {
            zoomPct = Math.min(250, zoomPct + 25);
            ui.pdfZoomPct = zoomPct;
            zoomLbl.textContent = zoomPct + '%';
            renderPdfPages();
          });

          pdfContainer.appendChild(pagesViewport);
          card.appendChild(pdfContainer);
          renderPdfPages();
          return card;
        }

        // =====================================================================
        // CASE D: BASE64 IMAGE
        // =====================================================================
        if (b64Info.isBase64 && kind === 'image') {
          const imgContainer = document.createElement('div');
          imgContainer.className = 'bg-[#0d1320] flex flex-col';

          let zoomPct = ui.imgZoomPct || 100;
          const zoomBar = document.createElement('div');
          zoomBar.className = 'px-3 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 text-xs';

          const dimText = document.createElement('span');
          dimText.className = 'text-slate-400 font-mono-code text-[11px]';
          dimText.textContent = b64Info.mime || 'image';
          zoomBar.appendChild(dimText);

          const zoomCtrls = document.createElement('div');
          zoomCtrls.className = 'flex items-center gap-1.5';

          const zoomOutBtn = document.createElement('button');
          zoomOutBtn.type = 'button';
          zoomOutBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomOutBtn.textContent = '−';

          const zoomValSpan = document.createElement('span');
          zoomValSpan.className = 'font-mono-code text-[11px] text-slate-200 min-w-[42px] text-center';
          zoomValSpan.textContent = zoomPct + '%';

          const zoomInBtn = document.createElement('button');
          zoomInBtn.type = 'button';
          zoomInBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomInBtn.textContent = '+';

          const zoomResetBtn = document.createElement('button');
          zoomResetBtn.type = 'button';
          zoomResetBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-300 text-[11px]';
          zoomResetBtn.textContent = 'Fit width';

          zoomCtrls.appendChild(zoomOutBtn);
          zoomCtrls.appendChild(zoomValSpan);
          zoomCtrls.appendChild(zoomInBtn);
          zoomCtrls.appendChild(zoomResetBtn);
          zoomBar.appendChild(zoomCtrls);
          imgContainer.appendChild(zoomBar);

          const imgViewport = document.createElement('div');
          imgViewport.className = 'p-3 overflow-auto max-h-[760px] resize-y bg-[#0b0f17] flex justify-center items-start';

          const imgPreviewWrap = document.createElement('div');
          imgPreviewWrap.className = 'bg-white p-2 rounded border border-slate-300 shadow-lg inline-block transition-all';
          imgPreviewWrap.style.width = zoomPct + '%';

          const img = document.createElement('img');
          img.src = b64Info.imageDataUrl;
          img.alt = 'Decoded Base64 Image';
          img.className = 'w-full h-auto block rounded';
          img.addEventListener('load', function () {
            if (img.naturalWidth && img.naturalHeight) {
              dimText.textContent = (b64Info.mime || 'image') + ' • ' + img.naturalWidth + ' × ' + img.naturalHeight + ' px';
            }
          });

          function applyZoom(nextZoom) {
            zoomPct = Math.min(300, Math.max(25, nextZoom));
            ui.imgZoomPct = zoomPct;
            zoomValSpan.textContent = zoomPct + '%';
            imgPreviewWrap.style.width = zoomPct + '%';
          }

          zoomOutBtn.addEventListener('click', function () {
            applyZoom(zoomPct - 25);
          });
          zoomInBtn.addEventListener('click', function () {
            applyZoom(zoomPct + 25);
          });
          zoomResetBtn.addEventListener('click', function () {
            applyZoom(100);
          });

          imgPreviewWrap.appendChild(img);
          imgViewport.appendChild(imgPreviewWrap);
          imgContainer.appendChild(imgViewport);
          card.appendChild(imgContainer);
          return card;
        }

        // =====================================================================
        // CASE E: BASE64 HTML
        // =====================================================================
        if (b64Info.isBase64 && kind === 'html') {
          const innerHtmlCard = buildHtmlValueCard(
            b64Info.decodedText || '',
            pathArr,
            ui,
            function (updatedHtml) {
              updateDecodedContent(updatedHtml);
            },
            'DECODED HTML'
          );
          innerHtmlCard.className = 'w-full border-0 bg-transparent';
          card.appendChild(innerHtmlCard);
          return card;
        }

        // =====================================================================
        // CASE F: DECODED PLAIN TEXT OR JSON
        // =====================================================================
        let decodedStr = '';
        if (b64Info.isBase64 && typeof b64Info.decodedText === 'string') {
          decodedStr = b64Info.decodedText;
        } else {
          try {
            decodedStr = base64ToUtf8(rawVal, true);
          } catch (e) {
            decodedStr = rawVal;
          }
        }

        const bodyWrap = document.createElement('div');
        bodyWrap.className = 'p-2.5 bg-[#0b111b] space-y-1.5';

        const ta = document.createElement('textarea');
        const lines = decodedStr.split('\n').length;
        ta.rows = Math.min(14, Math.max(3, lines));
        ta.spellcheck = false;
        ta.value = decodedStr;
        ta.className = 'w-full bg-[#070b12] border border-emerald-500/35 focus:border-emerald-400 rounded px-3 py-2 font-mono-code text-[13px] text-emerald-100 leading-relaxed focus:outline-none resize-y';

        ta.addEventListener('input', function () {
          updateDecodedContent(ta.value);
        });

        bodyWrap.appendChild(ta);
        card.appendChild(bodyWrap);
        return card;
      }

      /**
       * Shared Interactive Spreadsheet Grid for Base64 CSV and Base64 Excel (.xlsx / .xls)
       * Every cell is directly editable and syncs back into Base64 in the JSON/dict!
       */
      function buildEditableSpreadsheetGrid(grid, onGridChange, subtitleText) {
        const wrap = document.createElement('div');
        wrap.className = 'bg-[#0b111b] flex flex-col';

        // Subbar with "+ Row" and "+ Col" buttons
        const bar = document.createElement('div');
        bar.className = 'px-3 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 text-xs';

        const lbl = document.createElement('span');
        lbl.className = 'text-slate-300 text-[11.5px]';
        lbl.textContent = subtitleText || 'Editable Table';
        bar.appendChild(lbl);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'flex items-center gap-1.5';

        const addRowBtn = document.createElement('button');
        addRowBtn.type = 'button';
        addRowBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-emerald-300 font-mono-code text-[11px]';
        addRowBtn.textContent = '+ Row';
        addRowBtn.addEventListener('click', function () {
          const cols = (grid[0] && grid[0].length) || 1;
          grid.push(new Array(cols).fill(''));
          onGridChange(grid);
          renderTableDom();
        });

        const addColBtn = document.createElement('button');
        addColBtn.type = 'button';
        addColBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-sky-300 font-mono-code text-[11px]';
        addColBtn.textContent = '+ Col';
        addColBtn.addEventListener('click', function () {
          grid.forEach(r => r.push(''));
          onGridChange(grid);
          renderTableDom();
        });

        btnGroup.appendChild(addRowBtn);
        btnGroup.appendChild(addColBtn);
        bar.appendChild(btnGroup);
        wrap.appendChild(bar);

        const tableScroll = document.createElement('div');
        tableScroll.className = 'p-2.5 overflow-x-auto max-h-[460px] overflow-y-auto resize-y';

        function renderTableDom() {
          tableScroll.innerHTML = '';
          const tbl = document.createElement('table');
          tbl.className = 'w-full border-collapse text-xs font-mono-code bg-[#070b12]';

          for (let r = 0; r < grid.length; r++) {
            const tr = document.createElement('tr');
            const isHeader = r === 0 && grid.length > 1;
            tr.className = isHeader ? 'bg-[#162238] text-sky-200 font-semibold' : 'border-t border-[#1e293b] text-slate-100';

            // Row number index cell
            const idxTd = document.createElement('td');
            idxTd.className = 'px-2 py-1 text-[10px] text-slate-500 bg-[#0d1422] border border-[#1e293b] select-none text-center w-8';
            idxTd.textContent = isHeader ? '#' : String(r);
            tr.appendChild(idxTd);

            for (let c = 0; c < grid[r].length; c++) {
              const td = document.createElement('td');
              td.className = 'border border-[#1e293b] p-0 min-w-[110px]';

              const cellInput = document.createElement('input');
              cellInput.type = 'text';
              cellInput.value = String(grid[r][c] == null ? '' : grid[r][c]);
              cellInput.className = (isHeader
                ? 'w-full px-2.5 py-1.5 bg-transparent text-sky-200 font-semibold focus:bg-[#0b1528]'
                : 'w-full px-2.5 py-1.5 bg-transparent text-slate-100 focus:bg-[#0f172a]') +
                ' text-xs font-mono-code focus:outline-none focus:ring-1 focus:ring-emerald-400';

              cellInput.addEventListener('input', (function (rowIdx, colIdx, inp) {
                return function () {
                  const raw = inp.value;
                  // Preserve numeric types in Excel if applicable
                  const num = Number(raw);
                  grid[rowIdx][colIdx] = (raw.trim() !== '' && !Number.isNaN(num) && String(num) === raw.trim()) ? num : raw;
                  onGridChange(grid);
                };
              })(r, c, cellInput));

              td.appendChild(cellInput);
              tr.appendChild(td);
            }
            tbl.appendChild(tr);
          }

          tableScroll.appendChild(tbl);
        }

        renderTableDom();
        wrap.appendChild(tableScroll);
        return wrap;
      }

      // =========================================================================
      // 10. TOP BAR & GLOBAL BUTTON WIRING
      // =========================================================================
      function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'px-3 py-1.5 rounded-lg bg-[#1e293b] border border-sky-500/40 text-slate-100 text-xs font-medium shadow-lg transition-opacity';
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(function () {
          t.style.opacity = '0';
          setTimeout(function () {
            if (t.parentNode) t.parentNode.removeChild(t);
          }, 250);
        }, 2000);
      }

      rawInputArea.addEventListener('input', function () {
        handleLeftInputChanged(false);
      });

      // When user pastes new JSON/dict into the Input box, capture that pasted payload as the new "original" baseline!
      rawInputArea.addEventListener('paste', function () {
        setTimeout(function () {
          handleLeftInputChanged(true);
          showToast('Captured pasted input as original baseline');
        }, 20);
      });

      // Sample buttons
      document.getElementById('loadSampleBtn').addEventListener('click', function () {
        state.data = JSON.parse(JSON.stringify(SCREENSHOT_SAMPLE_JSON));
        state.detectedInputFormat = 'json';
        state.collapsedPaths.clear();
        state.nodeUiState = {};
        syncRightToLeft(true, true);
        showToast('Loaded sample JSON');
      });

      document.getElementById('samplePythonDictBtn').addEventListener('click', function () {
        rawInputArea.value = SAMPLE_PYTHON_DICT;
        state.collapsedPaths.clear();
        state.nodeUiState = {};
        handleLeftInputChanged(true);
        showToast('Loaded Python dict sample');
      });

      // Open file input
      const openFileInput = document.getElementById('openFileInput');
      openFileInput.addEventListener('change', function () {
        const f = openFileInput.files && openFileInput.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          rawInputArea.value = String(ev.target.result || '');
          state.collapsedPaths.clear();
          state.nodeUiState = {};
          handleLeftInputChanged(true);
          showToast('Opened ' + f.name);
        };
        reader.readAsText(f);
      });

      // Output format dropdown
      outputModeSelect.addEventListener('change', function () {
        state.outputMode = outputModeSelect.value;
        if (state.data !== undefined) {
          syncRightToLeft(true);
        }
      });

      // Indent dropdown
      indentSelect.addEventListener('change', function () {
        state.indentSetting = indentSelect.value;
        if (state.data !== undefined) {
          syncRightToLeft(false);
        }
      });

      // Format button
      document.getElementById('formatRawBtn').addEventListener('click', function () {
        const res = parseJsonOrPythonDict(rawInputArea.value);
        if (res.ok) {
          state.data = res.value;
          state.detectedInputFormat = res.detectedFormat;
          syncRightToLeft(true);
          showToast('Formatted successfully');
        } else {
          updateTopBadgesAndStatus(false, res.error);
        }
      });

      // Copy button
      document.getElementById('copyRawBtn').addEventListener('click', function () {
        const text = rawInputArea.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('Copied to clipboard');
          }).catch(function () {
            rawInputArea.select();
            document.execCommand('copy');
            showToast('Copied to clipboard');
          });
        } else {
          rawInputArea.select();
          document.execCommand('copy');
          showToast('Copied to clipboard');
        }
      });

      // Download button
      document.getElementById('downloadRawBtn').addEventListener('click', function () {
        const ext = getEffectiveOutputFormat() === 'python' ? 'py' : 'json';
        const blob = new Blob([rawInputArea.value], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.' + ext;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded data.' + ext);
      });

      // Clear button
      document.getElementById('clearRawBtn').addEventListener('click', function () {
        state.data = {};
        state.collapsedPaths.clear();
        syncRightToLeft(true);
        showToast('Cleared editor');
      });

      // Auto-repair button
      autoRepairBtn.addEventListener('click', function () {
        const cleaned = rawInputArea.value.trim().replace(/,\s*([}\]])/g, '$1');
        const res = parseJsonOrPythonDict(cleaned);
        if (res.ok) {
          rawInputArea.value = cleaned;
          handleLeftInputChanged();
          showToast('Repaired trailing comma / syntax');
        } else {
          showToast('Could not auto-fix: ' + res.error);
        }
      });

      // Filter keys / values search input
      const searchNodesInput = document.getElementById('searchNodesInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchNodesInput.addEventListener('input', function () {
        state.searchQuery = searchNodesInput.value.trim();
        if (state.searchQuery) clearSearchBtn.classList.remove('hidden');
        else clearSearchBtn.classList.add('hidden');
        renderTree();
      });

      clearSearchBtn.addEventListener('click', function () {
        searchNodesInput.value = '';
        state.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderTree();
      });

      // Expand all / Collapse all
      document.getElementById('expandAllBtn').addEventListener('click', function () {
        state.collapsedPaths.clear();
        renderTree();
      });

      document.getElementById('collapseAllBtn').addEventListener('click', function () {
        function walkCollapse(val, pathArr) {
          if (val && typeof val === 'object') {
            if (pathArr.length > 0) {
              state.collapsedPaths.add(pathKey(pathArr));
            }
            for (const k of Object.keys(val)) {
              walkCollapse(val[k], pathArr.concat([k]));
            }
          }
        }
        walkCollapse(state.data, []);
        renderTree();
      });

      // =========================================================================
      // 11. ADJUSTABLE SPLIT PANE RESIZER & RESET TO ORIGINAL
      // =========================================================================
      const splitWorkspace = document.getElementById('splitWorkspace');
      const leftEditorPane = document.getElementById('leftEditorPane');
      const paneResizer = document.getElementById('paneResizer');
      const resetPaneSplitBtn = document.getElementById('resetPaneSplitBtn');
      const resetOriginalBtn = document.getElementById('resetOriginalBtn');
      const editorWidthSlider = document.getElementById('editorWidthSlider');
      const editorWidthLabel = document.getElementById('editorWidthLabel');

      function applySplitDimensions() {
        const pct = Math.min(80, Math.max(20, state.leftSplitPct));
        leftEditorPane.style.width = pct + '%';
        leftEditorPane.style.flexBasis = pct + '%';
        if (editorWidthSlider) editorWidthSlider.value = String(Math.round(pct));
        if (editorWidthLabel) editorWidthLabel.textContent = Math.round(pct) + '%';

        const splitChanged = Math.abs(pct - DEFAULT_LEFT_SPLIT_PCT) > 0.5;
        if (splitChanged) {
          resetPaneSplitBtn.classList.remove('hidden');
        } else {
          resetPaneSplitBtn.classList.add('hidden');
        }
      }

      function resetSplitLayout() {
        state.leftSplitPct = DEFAULT_LEFT_SPLIT_PCT;
        applySplitDimensions();
      }

      if (editorWidthSlider) {
        editorWidthSlider.addEventListener('input', function () {
          state.leftSplitPct = Number(editorWidthSlider.value) || DEFAULT_LEFT_SPLIT_PCT;
          applySplitDimensions();
        });
      }

      // Mouse & Pointer drag on #paneResizer attached to window for smooth tracking across panes
      let isDraggingSplit = false;

      paneResizer.addEventListener('mousedown', function (e) {
        e.preventDefault();
        isDraggingSplit = true;
        paneResizer.classList.add('is-dragging');
        document.body.classList.add('resizing-col');
      });

      paneResizer.addEventListener('touchstart', function (e) {
        isDraggingSplit = true;
        paneResizer.classList.add('is-dragging');
        document.body.classList.add('resizing-col');
      }, { passive: true });

      window.addEventListener('mousemove', function (e) {
        if (!isDraggingSplit) return;
        const rect = splitWorkspace.getBoundingClientRect();
        if (rect.width <= 0) return;
        const offsetX = e.clientX - rect.left;
        const pct = Math.min(80, Math.max(20, (offsetX / rect.width) * 100));
        state.leftSplitPct = Math.round(pct * 10) / 10;
        applySplitDimensions();
      });

      window.addEventListener('touchmove', function (e) {
        if (!isDraggingSplit || !e.touches || !e.touches[0]) return;
        const rect = splitWorkspace.getBoundingClientRect();
        if (rect.width <= 0) return;
        const offsetX = e.touches[0].clientX - rect.left;
        const pct = Math.min(80, Math.max(20, (offsetX / rect.width) * 100));
        state.leftSplitPct = Math.round(pct * 10) / 10;
        applySplitDimensions();
      }, { passive: true });

      function stopSplitDrag() {
        if (!isDraggingSplit) return;
        isDraggingSplit = false;
        paneResizer.classList.remove('is-dragging');
        document.body.classList.remove('resizing-col');
      }

      window.addEventListener('mouseup', stopSplitDrag);
      window.addEventListener('touchend', stopSplitDrag);

      // Double-click splitter bar to reset split ratio
      paneResizer.addEventListener('dblclick', function () {
        resetSplitLayout();
        showToast('Reset panel split to default');
      });

      resetPaneSplitBtn.addEventListener('click', function () {
        resetSplitLayout();
        showToast('Reset panel split to default');
      });

      window.addEventListener('resize', applySplitDimensions);

      // "Reset to original" button: restores original unedited JSON/dict data AND resets split layout
      resetOriginalBtn.addEventListener('click', function () {
        if (state.originalDataClone !== null) {
          state.data = deepClone(state.originalDataClone);
          state.detectedInputFormat = state.originalFormat || 'json';
          state.outputMode = 'same';
          outputModeSelect.value = 'same';
          state.collapsedPaths.clear();
          state.nodeUiState = {};
          if (state.originalRawText) {
            rawInputArea.value = state.originalRawText;
          } else {
            rawInputArea.value = serializeCurrentData(state.data);
          }
          state.isModifiedFromOriginal = false;
          updateModifiedBadge();
          updateTopBadgesAndStatus(true);
          renderTree();
        }
        resetSplitLayout();
        showToast('Reset data and layout to original');
      });

      // Initialize with the exact screenshot RFQ Email + HTML + Base64 sample
      state.data = JSON.parse(JSON.stringify(SCREENSHOT_SAMPLE_JSON));
      state.detectedInputFormat = 'json';
      applySplitDimensions();
      syncRightToLeft(true, true);
    })();
  </script>
</body>
</html>
