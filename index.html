<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON / Dict Visual Editor</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', Consolas, monospace;
    }
    /* Subtle dark IDE scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: #263147;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b4b6b;
    }
    /* Tree vertical guide lines */
    .tree-children-guide {
      border-left: 1px solid #1e293b;
      margin-left: 7px;
      padding-left: 14px;
    }
    /* White rendered HTML preview box (matches email/document rendering in screenshot) */
    .rendered-html-canvas {
      background: #ffffff;
      color: #111827;
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      border-radius: 4px;
      padding: 14px 16px;
      overflow-x: auto;
      max-height: 640px;
      min-height: 120px;
      resize: vertical;
      overflow-y: auto;
      word-break: break-word;
    }
    .rendered-html-canvas[contenteditable="true"]:focus {
      outline: 2px solid #38bdf8;
      outline-offset: -1px;
    }
    .rendered-html-canvas table {
      border-collapse: collapse;
      width: 100%;
      margin: 6px 0;
      font-size: 12.5px;
    }
    .rendered-html-canvas th,
    .rendered-html-canvas td {
      border: 1px solid #94a3b8;
      padding: 5px 8px;
      text-align: left;
      vertical-align: top;
    }
    .rendered-html-canvas a {
      color: #0284c7;
      text-decoration: underline;
    }
    .rendered-html-canvas p {
      margin: 0 0 8px 0;
    }
    /* Draggable Split Pane Resizer */
    .split-resizer {
      position: relative;
      width: 8px;
      background-color: #161f33;
      border-left: 1px solid #1f293d;
      border-right: 1px solid #1f293d;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      z-index: 30;
      user-select: none;
      touch-action: none;
      cursor: col-resize;
    }
    .split-resizer:hover,
    .split-resizer.is-dragging {
      background-color: #0284c7;
      border-color: #38bdf8;
    }
    .split-resizer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -6px;
      right: -6px;
    }
    body.resizing-col {
      cursor: col-resize !important;
      user-select: none !important;
    }
    body.resizing-row {
      cursor: row-resize !important;
      user-select: none !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none sm:select-auto">

  <!-- TOP HEADER BAR (Matches Screenshot) -->
  <header class="bg-[#111726] border-b border-[#1f293d] px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
    <!-- Left Brand -->
    <div class="flex items-center gap-2.5">
      <span class="text-sky-400 font-mono-code font-bold text-base tracking-tight">{ }</span>
      <h1 class="font-semibold text-[15px] text-slate-100 tracking-tight">JSON / Dict Visual Editor</h1>
    </div>

    <!-- Right Toolbar Controls -->
    <div class="flex flex-wrap items-center gap-2 text-xs">
      <!-- Sample Selector / Button -->
      <div class="inline-flex items-center rounded bg-[#1a2234] border border-[#2a3650] overflow-hidden">
        <button id="loadSampleBtn" type="button" class="px-2.5 py-1 text-slate-200 hover:bg-[#232e46] font-medium transition" title="Load default RFQ Email JSON with HTML & Base64">
          Sample
        </button>
        <button id="samplePythonDictBtn" type="button" class="px-2 py-1 text-sky-300 hover:bg-[#232e46] border-l border-[#2a3650] font-mono-code text-[11px] transition" title="Load Python Dict sample with single quotes, True & None">
          py
        </button>
      </div>

      <!-- Open File -->
      <label class="cursor-pointer px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition inline-flex items-center">
        <span>Open file</span>
        <input id="openFileInput" type="file" accept=".json,.py,.txt,.dict,application/json,text/plain" class="hidden" />
      </label>

      <!-- Output Format Select -->
      <div class="flex items-center gap-1.5 text-slate-400">
        <span>Output</span>
        <select id="outputModeSelect" class="bg-[#151c2c] border border-[#2a3650] hover:border-slate-500 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-sky-500">
          <option value="same" selected>Same as input</option>
          <option value="json">JSON</option>
          <option value="python">Python dict</option>
        </select>
      </div>

      <!-- Indent Select -->
      <div class="flex items-center gap-1.5 text-slate-400">
        <span>Indent</span>
        <select id="indentSelect" class="bg-[#151c2c] border border-[#2a3650] hover:border-slate-500 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-sky-500">
          <option value="4" selected>4 spaces</option>
          <option value="2">2 spaces</option>
          <option value="tab">Tab</option>
          <option value="0">Compact</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <button id="formatRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Format
      </button>
      <button id="resetOriginalBtn" type="button" class="px-2.5 py-1 rounded bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 font-medium transition flex items-center gap-1" title="Revert all edits back to original pasted/loaded input and reset split layout">
        <span>↺ Reset to original</span>
      </button>
      <button id="copyRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Copy
      </button>
      <button id="downloadRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-medium transition">
        Download
      </button>
      <button id="clearRawBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-rose-950/60 hover:border-rose-700/60 border border-[#2a3650] text-slate-200 hover:text-rose-200 font-medium transition">
        Clear
      </button>
    </div>
  </header>

  <!-- MAIN SPLIT WORKSPACE -->
  <main id="splitWorkspace" class="flex-1 flex flex-row min-h-0 overflow-hidden relative">

    <!-- LEFT PANE: INPUT (JSON or Python Dict) -->
    <section id="leftEditorPane" style="width: 44%; flex-basis: 44%;" class="h-full flex flex-col bg-[#0b0f17] shrink-0 min-w-[180px] max-w-[85%]">
      <!-- Left Pane Subheader -->
      <div class="px-3.5 py-2 bg-[#111726] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="flex flex-wrap items-center gap-2 min-w-0">
          <span class="font-bold text-xs text-slate-100">Input</span>
          <span class="text-xs text-slate-400 truncate">Paste JSON or a Python dict — edits on the right sync back here</span>
          <span id="detectedSyntaxBadge" class="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-400 border border-sky-500/30 font-mono-code font-semibold text-[10px] tracking-wide">
            JSON
          </span>
          <span id="editedStateBadge" class="hidden px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 font-mono-code font-semibold text-[10px]">
            Modified
          </span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400" title="Adjust JSON Editor width">
            <span class="hidden sm:inline">Width</span>
            <input id="editorWidthSlider" type="range" min="20" max="80" step="1" value="44" class="w-16 sm:w-20 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400" />
            <span id="editorWidthLabel" class="font-mono-code text-[10.5px] text-slate-300 w-8 text-right">44%</span>
          </div>
          <button id="resetPaneSplitBtn" type="button" class="hidden px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-[10.5px] text-slate-300 font-mono-code transition" title="Reset editor width to default (44%)">
            Reset split
          </button>
        </div>
      </div>

      <!-- Raw Code Textarea -->
      <div class="relative flex-1 min-h-0 flex flex-col">
        <textarea
          id="rawInputArea"
          spellcheck="false"
          wrap="off"
          placeholder="Paste JSON or a Python dict here..."
          class="w-full flex-1 p-3.5 bg-[#0b0f17] text-slate-100 font-mono-code text-[12.5px] leading-[1.55] focus:outline-none resize-none border-0 overflow-auto"
        ></textarea>
      </div>

      <!-- Bottom Parse Status Bar -->
      <div id="parseStatusBar" class="px-3.5 py-1.5 bg-[#0e1420] border-t border-[#1f293d] flex items-center justify-between gap-2 text-xs shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span id="parseStatusIcon" class="text-emerald-400 font-bold">✓</span>
          <span id="parseStatusText" class="text-emerald-400 truncate">Parsed successfully</span>
        </div>
        <div class="flex items-center gap-2 text-[11px] text-slate-400 shrink-0">
          <button id="autoRepairBtn" type="button" class="hidden px-2 py-0.5 rounded bg-rose-800/80 hover:bg-rose-700 text-rose-100 font-medium transition">
            Auto-fix syntax
          </button>
          <span id="statsSummaryText" class="font-mono-code text-slate-500"></span>
        </div>
      </div>
    </section>

    <!-- DRAGGABLE RESIZER DIVIDER BETWEEN INPUT & VIEWER -->
    <div
      id="paneResizer"
      role="separator"
      aria-label="Drag left or right to adjust JSON Editor width (double-click to reset)"
      title="Drag left or right to adjust JSON Editor width (Double-click to reset)"
      class="split-resizer h-full shrink-0 flex items-center justify-center group"
    >
      <div class="w-1 h-12 rounded-full bg-slate-500 group-hover:bg-white transition flex flex-col items-center justify-center gap-0.5"></div>
    </div>

    <!-- RIGHT PANE: VIEWER / EDITOR -->
    <section id="rightViewerPane" class="flex-1 h-full flex flex-col bg-[#0d121d] min-w-[200px] overflow-hidden">
      <!-- Right Pane Subheader -->
      <div class="px-3.5 py-2 bg-[#111726] border-b border-[#1f293d] flex flex-wrap items-center gap-2.5 shrink-0">
        <span class="font-bold text-xs text-slate-100 shrink-0">Viewer / Editor</span>

        <div class="relative flex-1 min-w-[160px]">
          <input
            id="searchNodesInput"
            type="text"
            placeholder="Filter keys / values..."
            class="w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 text-xs text-slate-100 placeholder-slate-500 focus:outline-none"
          />
          <button id="clearSearchBtn" type="button" class="hidden absolute right-2 top-1 text-slate-400 hover:text-slate-200 text-xs">✕</button>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="expandAllBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-xs font-medium transition">
            Expand all
          </button>
          <button id="collapseAllBtn" type="button" class="px-2.5 py-1 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 text-xs font-medium transition">
            Collapse all
          </button>
        </div>
      </div>

      <!-- Scrollable Tree Container -->
      <div id="inspectorTreeContainer" class="flex-1 p-3.5 overflow-y-auto overflow-x-hidden space-y-1.5">
        <!-- Populated dynamically by JavaScript -->
      </div>
    </section>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. UTF-8 <-> BASE64 UTILITIES
      // =========================================================================
      function utf8ToBase64(str) {
        try {
          const bytes = new TextEncoder().encode(str);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        } catch (e) {
          return btoa(unescape(encodeURIComponent(str)));
        }
      }

      function base64ToUtf8(b64) {
        const clean = b64.replace(/[\r\n\s]/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      }

      // =========================================================================
      // 2. SAMPLE PAYLOADS (EXACT SCREENSHOT RFQ EMAIL JSON + PYTHON DICT SAMPLE)
      // =========================================================================
      const RFQ_BODY_HTML = `<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><body><div style="font-family:Calibri,Arial,sans-serif;font-size:13.5px;color:#111827;"><p>This is a request for quotation for the items in the table below. (This is not a purchase order.), please complete the fields in light blue <span style="color:#dc2626;font-weight:600;">within 48 hours.</span></p><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;"><thead><tr style="background-color:#2b6cb0;color:#ffffff;font-weight:bold;"><th>Material Number</th><th>Item Description</th><th>Manufacturer</th><th>Manufacturer Part Number</th><th>Vendor #</th><th>Vendor</th><th>Qty</th><th style="background-color:#0284c7;">Unit Price (Edit)</th><th style="background-color:#0284c7;">Lead Time (Edit)</th></tr></thead><tbody><tr><td>21004589</td><td>VALVE BALL 2 INCH SS316</td><td>SWAGELOK</td><td>SS-600-1-4</td><td>15098214</td><td>FLOWTECH IND</td><td>12</td><td style="background-color:#e0f2fe;font-weight:600;">$145.00</td><td style="background-color:#e0f2fe;font-weight:600;">14 Days</td></tr><tr><td>21008912</td><td>PRESSURE GAUGE 0-10 BAR</td><td>WIKA</td><td>232.50.100</td><td>15098214</td><td>FLOWTECH IND</td><td>6</td><td style="background-color:#e0f2fe;font-weight:600;">$68.50</td><td style="background-color:#e0f2fe;font-weight:600;">7 Days</td></tr></tbody></table><p style="margin-top:10px;color:#475569;font-size:12px;">Business Use — Regards, Ranjit Mane</p></div></body></html>`;

      const SCREENSHOT_SAMPLE_JSON = {};

      const SAMPLE_PYTHON_DICT = `{}`;

      // =========================================================================
      // 3. STATE MANAGEMENT
      // =========================================================================
      const DEFAULT_LEFT_SPLIT_PCT = 44;
      const DEFAULT_TOP_SPLIT_PCT = 42;

      const state = {
        data: null,
        originalRawText: '',         // Original raw text snapshot when pasted/loaded
        originalDataClone: null,     // Deep clone of original parsed data
        originalFormat: 'json',      // Original detected format
        isModifiedFromOriginal: false,
        leftSplitPct: DEFAULT_LEFT_SPLIT_PCT,
        topSplitPct: DEFAULT_TOP_SPLIT_PCT,
        detectedInputFormat: 'json', // 'json' | 'python'
        outputMode: 'same',          // 'same' | 'json' | 'python'
        indentSetting: '4',          // '4' | '2' | 'tab' | '0'
        searchQuery: '',
        collapsedPaths: new Set(),
        nodeUiState: {}              // pathKey -> { htmlTab: 'rendered'|'source', editVisually: true, b64Tab: 'decoded'|'raw', b64HtmlTab: 'rendered'|'source', forceMode: null }
      };

      function deepClone(val) {
        if (val === undefined) return undefined;
        return JSON.parse(JSON.stringify(val));
      }

      function saveOriginalSnapshot(rawText, parsedVal, detectedFmt) {
        state.originalRawText = rawText;
        state.originalDataClone = deepClone(parsedVal);
        state.originalFormat = detectedFmt || 'json';
        state.isModifiedFromOriginal = false;
        updateModifiedBadge();
      }

      function updateModifiedBadge() {
        const badge = document.getElementById('editedStateBadge');
        if (!badge) return;
        if (state.isModifiedFromOriginal) {
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }

      function getNodeUi(pathKey) {
        if (!state.nodeUiState[pathKey]) {
          state.nodeUiState[pathKey] = {
            htmlTab: 'rendered',     // 'rendered' | 'source'
            editVisually: true,      // checkbox state
            b64Tab: 'decoded',       // 'decoded' | 'raw'
            b64HtmlTab: 'rendered',  // when base64 decodes to HTML
            forceMode: null          // null | 'html' | 'base64' | 'plain'
          };
        }
        return state.nodeUiState[pathKey];
      }

      // =========================================================================
      // 4. PARSER (JSON + PYTHON DICT) & SERIALIZER
      // =========================================================================
      function parseJsonOrPythonDict(rawText) {
        const trimmed = rawText.trim();
        if (!trimmed) {
          return { ok: false, error: 'Input is empty' };
        }
        try {
          const parsed = JSON.parse(trimmed);
          return { ok: true, value: parsed, detectedFormat: 'json' };
        } catch (jsonErr) {
          try {
            const pyValue = parsePythonLiteral(trimmed);
            return { ok: true, value: pyValue, detectedFormat: 'python' };
          } catch (pyErr) {
            return {
              ok: false,
              error: pyErr.message || jsonErr.message || 'Invalid JSON or Python dict syntax'
            };
          }
        }
      }

      function parsePythonLiteral(src) {
        let i = 0;
        const n = src.length;

        function skipWs() {
          while (i < n) {
            const c = src[i];
            if (c === ' ' || c === '\t' || c === '\n' || c === '\r') i++;
            else if (c === '#') {
              while (i < n && src[i] !== '\n') i++;
            } else if (c === '/' && src[i + 1] === '/') {
              while (i < n && src[i] !== '\n') i++;
            } else break;
          }
        }

        function parseString() {
          if ((src[i] === 'r' || src[i] === 'u' || src[i] === 'b' || src[i] === 'R' || src[i] === 'U' || src[i] === 'B') &&
              (src[i + 1] === "'" || src[i + 1] === '"')) {
            i++;
          }
          const q = src[i];
          let triple = false;
          if (src[i + 1] === q && src[i + 2] === q) {
            triple = true;
            i += 3;
          } else {
            i += 1;
          }
          let out = '';
          while (i < n) {
            if (triple) {
              if (src[i] === q && src[i + 1] === q && src[i + 2] === q) {
                i += 3;
                return out;
              }
            } else {
              if (src[i] === q) {
                i += 1;
                return out;
              }
              if (src[i] === '\n' || src[i] === '\r') {
                throw new Error('Unterminated string at position ' + i);
              }
            }
            if (src[i] === '\\') {
              i++;
              if (i >= n) throw new Error('Unexpected end of escape sequence');
              const esc = src[i];
              if (esc === 'n') out += '\n';
              else if (esc === 'r') out += '\r';
              else if (esc === 't') out += '\t';
              else if (esc === '\\') out += '\\';
              else if (esc === "'") out += "'";
              else if (esc === '"') out += '"';
              else if (esc === '/') out += '/';
              else if (esc === 'b') out += '\b';
              else if (esc === 'f') out += '\f';
              else if (esc === 'u') {
                const hex = src.slice(i + 1, i + 5);
                if (/^[0-9a-fA-F]{4}$/.test(hex)) {
                  out += String.fromCharCode(parseInt(hex, 16));
                  i += 4;
                } else out += '\\u';
              } else out += esc;
              i++;
            } else {
              out += src[i++];
            }
          }
          throw new Error('Unterminated string literal');
        }

        function parseNumber() {
          const start = i;
          if (src[i] === '-' || src[i] === '+') i++;
          while (i < n && /[0-9_]/.test(src[i])) i++;
          if (i < n && src[i] === '.') {
            i++;
            while (i < n && /[0-9_]/.test(src[i])) i++;
          }
          if (i < n && (src[i] === 'e' || src[i] === 'E')) {
            i++;
            if (src[i] === '+' || src[i] === '-') i++;
            while (i < n && /[0-9_]/.test(src[i])) i++;
          }
          const num = Number(src.slice(start, i).replace(/_/g, ''));
          if (Number.isNaN(num)) throw new Error('Invalid number at position ' + start);
          return num;
        }

        function parseIdent(allowKey) {
          const start = i;
          while (i < n && /[a-zA-Z0-9_$]/.test(src[i])) i++;
          const w = src.slice(start, i);
          if (w === 'True' || w === 'true') return true;
          if (w === 'False' || w === 'false') return false;
          if (w === 'None' || w === 'null' || w === 'undefined') return null;
          if (allowKey && w.length > 0) return w;
          throw new Error('Unexpected token "' + w + '" at position ' + start);
        }

        function parseDict() {
          i++;
          const obj = {};
          skipWs();
          while (i < n && src[i] !== '}') {
            skipWs();
            if (src[i] === '}') break;
            let k;
            const c = src[i];
            if (c === "'" || c === '"' || ((c === 'r' || c === 'u' || c === 'b') && (src[i + 1] === "'" || src[i + 1] === '"'))) {
              k = parseString();
            } else if (/[a-zA-Z_$]/.test(c)) {
              k = String(parseIdent(true));
            } else if (/[0-9\-]/.test(c)) {
              k = String(parseNumber());
            } else {
              throw new Error('Expected key at position ' + i);
            }
            skipWs();
            if (src[i] !== ':') throw new Error('Expected ":" after key "' + k + '"');
            i++;
            skipWs();
            obj[k] = parseValue();
            skipWs();
            if (src[i] === ',') {
              i++;
              skipWs();
            } else if (src[i] === '}') break;
            else throw new Error('Expected "," or "}" at position ' + i);
          }
          if (src[i] !== '}') throw new Error('Expected "}"');
          i++;
          return obj;
        }

        function parseList(closeCh) {
          i++;
          const arr = [];
          skipWs();
          while (i < n && src[i] !== closeCh) {
            skipWs();
            if (src[i] === closeCh) break;
            arr.push(parseValue());
            skipWs();
            if (src[i] === ',') {
              i++;
              skipWs();
            } else if (src[i] === closeCh) break;
            else throw new Error('Expected "," or "' + closeCh + '" at position ' + i);
          }
          if (src[i] !== closeCh) throw new Error('Expected "' + closeCh + '"');
          i++;
          return arr;
        }

        function parseValue() {
          skipWs();
          if (i >= n) throw new Error('Unexpected end of input');
          const c = src[i];
          if (c === '{') return parseDict();
          if (c === '[') return parseList(']');
          if (c === '(') return parseList(')');
          if (c === "'" || c === '"' || ((c === 'r' || c === 'u' || c === 'b') && (src[i + 1] === "'" || src[i + 1] === '"'))) {
            return parseString();
          }
          if (c === '-' || c === '+' || (c >= '0' && c <= '9')) return parseNumber();
          if (/[a-zA-Z_$]/.test(c)) return parseIdent(false);
          throw new Error('Unexpected character "' + c + '" at position ' + i);
        }

        const res = parseValue();
        skipWs();
        if (i < n) throw new Error('Unexpected trailing characters at position ' + i);
        return res;
      }

      function getEffectiveOutputFormat() {
        if (state.outputMode === 'same') {
          return state.detectedInputFormat || 'json';
        }
        return state.outputMode;
      }

      function getIndentUnit() {
        if (state.indentSetting === 'tab') return '\t';
        const n = parseInt(state.indentSetting, 10);
        if (Number.isNaN(n) || n <= 0) return '';
        return ' '.repeat(n);
      }

      function serializeCurrentData(data) {
        const fmt = getEffectiveOutputFormat();
        const indentUnit = getIndentUnit();
        if (fmt === 'json') {
          if (!indentUnit) return JSON.stringify(data);
          return JSON.stringify(data, null, indentUnit);
        }
        return toPythonDictString(data, indentUnit, 0);
      }

      function toPythonDictString(val, indentUnit, depth) {
        if (val === null || val === undefined) return 'None';
        if (val === true) return 'True';
        if (val === false) return 'False';
        if (typeof val === 'number') return Number.isFinite(val) ? String(val) : 'None';
        if (typeof val === 'string') return escapePyString(val);

        const compact = indentUnit === '';
        const pad = compact ? '' : indentUnit.repeat(depth + 1);
        const closePad = compact ? '' : indentUnit.repeat(depth);
        const nl = compact ? '' : '\n';
        const colon = compact ? ': ' : ': ';
        const sep = compact ? ', ' : ',\n';

        if (Array.isArray(val)) {
          if (val.length === 0) return '[]';
          const items = val.map(v => pad + toPythonDictString(v, indentUnit, depth + 1));
          return '[' + nl + items.join(sep) + nl + closePad + ']';
        }
        if (typeof val === 'object') {
          const keys = Object.keys(val);
          if (keys.length === 0) return '{}';
          const pairs = keys.map(k => pad + escapePyString(k) + colon + toPythonDictString(val[k], indentUnit, depth + 1));
          return '{' + nl + pairs.join(sep) + nl + closePad + '}';
        }
        return String(val);
      }

      function escapePyString(str) {
        let out = "'";
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c === '\\') out += '\\\\';
          else if (c === "'") out += "\\'";
          else if (c === '\n') out += '\\n';
          else if (c === '\r') out += '\\r';
          else if (c === '\t') out += '\\t';
          else out += c;
        }
        out += "'";
        return out;
      }

      // =========================================================================
      // 5. HTML & BASE64 DETECTION
      // =========================================================================
      function isHtmlValue(str) {
        if (typeof str !== 'string' || str.length < 4) return false;
        return /<\s*(html|body|head|div|p|span|table|thead|tbody|tr|td|th|ul|ol|li|h[1-6]|a|strong|em|b|i|u|br|hr|img|section|article|blockquote|code|pre|form|svg|\!DOCTYPE)\b[^>]*>/i.test(str);
      }

      /**
       * Smart Base64 detector:
       * Detects `data:...;base64,...` URIs AND raw Base64 strings (like `contentBytes`)
       * that decode to valid printable UTF-8 text (e.g. "material reference, unit price, leadtime"),
       * HTML, JSON, SVG, or binary image headers (PNG, JPEG, GIF, WebP),
       * while ignoring opaque binary IDs like Outlook `messageID` (`AAMk...`) or `conversationID` (`AAQk...`).
       */
      function inspectBase64Value(str, keyName) {
        if (typeof str !== 'string' || str.length < 8) return { isBase64: false };
        const trimmed = str.trim();

        // 1. Explicit data:...;base64,... URI
        const dataMatch = trimmed.match(/^(data:([^;]+);base64,)(.+)$/is);
        if (dataMatch) {
          const prefix = dataMatch[1];
          const mime = dataMatch[2].toLowerCase();
          const rawB64 = dataMatch[3].replace(/[\r\n\s]/g, '');
          if (mime.startsWith('image/')) {
            return {
              isBase64: true,
              prefix: prefix,
              rawB64: rawB64,
              kind: 'image',
              mime: mime,
              imageDataUrl: prefix + rawB64
            };
          }
          try {
            const decoded = base64ToUtf8(rawB64);
            const kind = (mime.includes('html') || isHtmlValue(decoded)) ? 'html' : (isJsonString(decoded) ? 'json' : 'text');
            return { isBase64: true, prefix: prefix, rawB64: rawB64, kind: kind, mime: mime, decodedText: decoded };
          } catch (e) {
            return { isBase64: false };
          }
        }

        // Exclude known opaque Exchange/Graph IDs (`messageID`, `conversationID`) unless forced
        const lowerKey = String(keyName || '').toLowerCase();
        if (lowerKey === 'messageid' || lowerKey === 'conversationid' || trimmed.startsWith('AAMk') || trimmed.startsWith('AAQk')) {
          return { isBase64: false };
        }

        // 2. Raw Base64 string check
        if (trimmed.length < 12 || /\s/.test(trimmed) || trimmed.length % 4 !== 0) {
          return { isBase64: false };
        }
        if (!/^[A-Za-z0-9+/]+={0,2}$/.test(trimmed)) {
          return { isBase64: false };
        }
        // Must have either '=' padding, or Base64 hints in key name (`contentbytes`, `base64`, `b64`, `payload`, `token`, `encoded`), or >= 24 chars
        const hasKeyHint = /(base64|b64|bytes|encoded|payload|secret|token)/i.test(lowerKey);
        if (!trimmed.endsWith('=') && !hasKeyHint && trimmed.length < 24) {
          return { isBase64: false };
        }

        // Check known image headers
        const imgSigs = [
          { sig: 'iVBORw0KGgo', mime: 'image/png' },
          { sig: '/9j/', mime: 'image/jpeg' },
          { sig: 'R0lGOD', mime: 'image/gif' },
          { sig: 'UklGR', mime: 'image/webp' }
        ];
        for (let i = 0; i < imgSigs.length; i++) {
          if (trimmed.startsWith(imgSigs[i].sig)) {
            return {
              isBase64: true,
              prefix: '',
              rawB64: trimmed,
              kind: 'image',
              mime: imgSigs[i].mime,
              imageDataUrl: 'data:' + imgSigs[i].mime + ';base64,' + trimmed
            };
          }
        }

        // Try UTF-8 decode and verify printable characters
        try {
          const decoded = base64ToUtf8(trimmed);
          if (!decoded || decoded.length < 2) return { isBase64: false };
          for (let i = 0; i < decoded.length; i++) {
            const code = decoded.charCodeAt(i);
            if ((code < 32 && code !== 9 && code !== 10 && code !== 13) || code === 65533) {
              return { isBase64: false };
            }
          }
          if (/^\s*<svg[\s>]/i.test(decoded)) {
            return {
              isBase64: true,
              prefix: '',
              rawB64: trimmed,
              kind: 'image',
              mime: 'image/svg+xml',
              decodedText: decoded,
              imageDataUrl: 'data:image/svg+xml;base64,' + trimmed
            };
          }
          const kind = isHtmlValue(decoded) ? 'html' : (isJsonString(decoded) ? 'json' : 'text');
          const mime = kind === 'html' ? 'text/html' : (kind === 'json' ? 'application/json' : 'text/plain');
          return {
            isBase64: true,
            prefix: '',
            rawB64: trimmed,
            kind: kind,
            mime: mime,
            decodedText: decoded
          };
        } catch (e) {
          return { isBase64: false };
        }
      }

      function isJsonString(str) {
        if (typeof str !== 'string') return false;
        const t = str.trim();
        if (!(t.startsWith('{') && t.endsWith('}')) && !(t.startsWith('[') && t.endsWith(']'))) return false;
        try {
          JSON.parse(t);
          return true;
        } catch (e) {
          return false;
        }
      }

      function sanitizeHtmlForPreview(rawHtml) {
        // Strip <script> tags for preview safety while preserving styles, tables, and markup
        return String(rawHtml).replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      }

      // =========================================================================
      // 6. PATH & DATA MUTATION HELPERS
      // =========================================================================
      function pathKey(pathArr) {
        return JSON.stringify(pathArr);
      }

      function getValueAtPath(root, pathArr) {
        let cur = root;
        for (let i = 0; i < pathArr.length; i++) {
          if (cur == null) return undefined;
          cur = cur[pathArr[i]];
        }
        return cur;
      }

      function setValueAtPath(root, pathArr, newVal) {
        if (pathArr.length === 0) {
          state.data = newVal;
          return;
        }
        let cur = root;
        for (let i = 0; i < pathArr.length - 1; i++) {
          cur = cur[pathArr[i]];
        }
        cur[pathArr[pathArr.length - 1]] = newVal;
      }

      function deleteAtPath(root, pathArr) {
        if (pathArr.length === 0) return;
        let cur = root;
        for (let i = 0; i < pathArr.length - 1; i++) {
          cur = cur[pathArr[i]];
        }
        const last = pathArr[pathArr.length - 1];
        if (Array.isArray(cur)) cur.splice(Number(last), 1);
        else if (cur && typeof cur === 'object') delete cur[last];
      }

      function renameKeyAtPath(root, pathArr, newKey) {
        if (pathArr.length === 0 || !newKey) return false;
        let cur = root;
        for (let i = 0; i < pathArr.length - 1; i++) {
          cur = cur[pathArr[i]];
        }
        const oldKey = pathArr[pathArr.length - 1];
        if (oldKey === newKey || Array.isArray(cur)) return false;
        const entries = Object.entries(cur);
        for (const k of Object.keys(cur)) delete cur[k];
        for (const [k, v] of entries) {
          cur[k === oldKey ? newKey : k] = v;
        }
        return true;
      }

      function convertValueToType(currentVal, targetType) {
        if (targetType === 'string') {
          if (currentVal === null || currentVal === undefined) return '';
          if (typeof currentVal === 'object') return JSON.stringify(currentVal);
          return String(currentVal);
        }
        if (targetType === 'number') {
          const n = Number(currentVal);
          return Number.isFinite(n) ? n : 0;
        }
        if (targetType === 'boolean') {
          if (typeof currentVal === 'string') {
            return currentVal.trim().toLowerCase() !== 'false' && currentVal.trim() !== '0' && currentVal.trim() !== '';
          }
          return Boolean(currentVal);
        }
        if (targetType === 'null') return null;
        if (targetType === 'object') {
          if (currentVal && typeof currentVal === 'object' && !Array.isArray(currentVal)) return currentVal;
          return {};
        }
        if (targetType === 'array') {
          if (Array.isArray(currentVal)) return currentVal;
          return [];
        }
        return currentVal;
      }

      function getValueTypeName(val) {
        if (val === null || val === undefined) return 'null';
        if (Array.isArray(val)) return 'array';
        return typeof val; // 'object' | 'string' | 'number' | 'boolean'
      }

      // =========================================================================
      // 7. DOM REFERENCES & TWO-WAY SYNC
      // =========================================================================
      const rawInputArea = document.getElementById('rawInputArea');
      const detectedSyntaxBadge = document.getElementById('detectedSyntaxBadge');
      const parseStatusIcon = document.getElementById('parseStatusIcon');
      const parseStatusText = document.getElementById('parseStatusText');
      const autoRepairBtn = document.getElementById('autoRepairBtn');
      const statsSummaryText = document.getElementById('statsSummaryText');
      const inspectorTreeContainer = document.getElementById('inspectorTreeContainer');
      const outputModeSelect = document.getElementById('outputModeSelect');
      const indentSelect = document.getElementById('indentSelect');

      function updateTopBadgesAndStatus(ok, errorMessage) {
        const effectiveFmt = getEffectiveOutputFormat();
        detectedSyntaxBadge.textContent = effectiveFmt === 'python' ? 'PYTHON DICT' : 'JSON';

        if (ok) {
          parseStatusIcon.textContent = '✓';
          parseStatusIcon.className = 'text-emerald-400 font-bold';
          parseStatusText.textContent = 'Parsed successfully';
          parseStatusText.className = 'text-emerald-400 truncate';
          autoRepairBtn.classList.add('hidden');
        } else {
          parseStatusIcon.textContent = '✕';
          parseStatusIcon.className = 'text-rose-400 font-bold';
          parseStatusText.textContent = errorMessage || 'Syntax error';
          parseStatusText.className = 'text-rose-400 truncate font-mono-code';
          autoRepairBtn.classList.remove('hidden');
        }
      }

      /**
       * Syncs edits from the Right Pane (`state.data`) back to the Left Pane (`rawInputArea`).
       * If `reRenderTree` is false, keeps the current DOM focus intact for smooth typing!
       */
      function syncRightToLeft(reRenderTree, markAsOriginal) {
        const serialized = serializeCurrentData(state.data);
        rawInputArea.value = serialized;
        if (markAsOriginal) {
          saveOriginalSnapshot(serialized, state.data, state.detectedInputFormat);
        } else if (state.originalDataClone !== null) {
          state.isModifiedFromOriginal = JSON.stringify(state.data) !== JSON.stringify(state.originalDataClone);
          updateModifiedBadge();
        }
        updateTopBadgesAndStatus(true);
        if (reRenderTree) {
          renderTree();
        }
      }

      /**
       * Parses edits made directly in the Left Pane (`rawInputArea`) and updates the Right Pane tree.
       * When the user pastes or types a new valid JSON/dict in Input, we also capture it as the baseline original if none was edited yet or on paste.
       */
      function handleLeftInputChanged(captureAsOriginal) {
        const res = parseJsonOrPythonDict(rawInputArea.value);
        if (!res.ok) {
          updateTopBadgesAndStatus(false, res.error);
          return;
        }
        state.data = res.value;
        state.detectedInputFormat = res.detectedFormat;
        if (captureAsOriginal || state.originalDataClone === null) {
          saveOriginalSnapshot(rawInputArea.value, res.value, res.detectedFormat);
        } else {
          state.isModifiedFromOriginal = JSON.stringify(state.data) !== JSON.stringify(state.originalDataClone);
          updateModifiedBadge();
        }
        updateTopBadgesAndStatus(true);
        renderTree();
      }

      // =========================================================================
      // 8. TREE VIEW / VISUAL EDITOR RENDERING (MATCHING SCREENSHOT LAYOUT)
      // =========================================================================
      function nodeMatchesSearch(key, val, pathArr) {
        if (!state.searchQuery) return true;
        const q = state.searchQuery.toLowerCase();
        if (String(key).toLowerCase().includes(q)) return true;
        if (typeof val === 'string') {
          if (val.toLowerCase().includes(q)) return true;
          const b64 = inspectBase64Value(val, key);
          if (b64.isBase64 && b64.decodedText && b64.decodedText.toLowerCase().includes(q)) return true;
        } else if (val !== null && typeof val !== 'object') {
          if (String(val).toLowerCase().includes(q)) return true;
        }
        return false;
      }

      function subtreeMatchesSearch(val, pathArr) {
        if (!state.searchQuery) return true;
        if (val && typeof val === 'object') {
          for (const k of Object.keys(val)) {
            const childPath = pathArr.concat([k]);
            if (nodeMatchesSearch(k, val[k], childPath) || subtreeMatchesSearch(val[k], childPath)) {
              return true;
            }
          }
        }
        return false;
      }

      function renderTree() {
        inspectorTreeContainer.innerHTML = '';
        if (state.data === undefined) return;

        const rootNode = buildTreeRow('root', state.data, [], false, true);
        inspectorTreeContainer.appendChild(rootNode);
      }

      function buildTypeSelectDropdown(currentType, pathArr, keyLabel, val) {
        const sel = document.createElement('select');
        sel.className = 'bg-[#161f30] hover:bg-[#1e2940] border border-[#2a3650] rounded px-1.5 py-0.5 text-[11.5px] font-mono-code text-slate-200 focus:outline-none focus:border-sky-500 shrink-0 cursor-pointer';

        // Also allow switching string sub-mode (HTML / Base64) right from a dedicated pill or type menu
        const baseTypes = ['string', 'number', 'boolean', 'null', 'object', 'array'];
        baseTypes.forEach(function (t) {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          if (t === currentType) opt.selected = true;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', function () {
          const nextType = sel.value;
          const converted = convertValueToType(val, nextType);
          setValueAtPath(state.data, pathArr, converted);
          syncRightToLeft(true);
        });

        return sel;
      }

      function buildTreeRow(key, val, pathArr, parentIsArray, isRoot) {
        const pKey = pathKey(pathArr);
        const ui = getNodeUi(pKey);
        const vType = getValueTypeName(val);
        const isContainer = vType === 'object' || vType === 'array';
        const isArray = vType === 'array';
        const isCollapsed = state.collapsedPaths.has(pKey);

        const wrapper = document.createElement('div');
        wrapper.className = 'w-full';

        // Row Header / Main Line
        const row = document.createElement('div');
        row.className = 'group flex items-start gap-2 py-1 rounded hover:bg-slate-800/25 transition px-1';

        // 1. Collapse Caret (for containers) or spacer
        if (isContainer) {
          const caretBtn = document.createElement('button');
          caretBtn.type = 'button';
          caretBtn.className = 'w-4 h-5 flex items-center justify-center text-slate-400 hover:text-slate-100 text-[11px] shrink-0 mt-0.5';
          caretBtn.textContent = isCollapsed ? '▸' : '▾';
          caretBtn.addEventListener('click', function () {
            if (state.collapsedPaths.has(pKey)) state.collapsedPaths.delete(pKey);
            else state.collapsedPaths.add(pKey);
            renderTree();
          });
          row.appendChild(caretBtn);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'w-1 shrink-0';
          row.appendChild(spacer);
        }

        // 2. Key Name (or root / array index)
        if (isRoot) {
          const rootLbl = document.createElement('span');
          rootLbl.className = 'font-mono-code text-xs text-slate-300 font-medium mt-1 shrink-0';
          rootLbl.textContent = 'root';
          row.appendChild(rootLbl);
        } else if (parentIsArray) {
          const idxLbl = document.createElement('span');
          idxLbl.className = 'font-mono-code text-xs text-sky-400/80 min-w-[36px] mt-1 shrink-0';
          idxLbl.textContent = String(key);
          row.appendChild(idxLbl);
        } else {
          const keyInput = document.createElement('input');
          keyInput.type = 'text';
          keyInput.value = String(key);
          keyInput.title = 'Click to edit key name';
          keyInput.className = 'w-[125px] sm:w-[140px] bg-transparent hover:bg-[#161f30] focus:bg-[#0b0f17] border border-transparent focus:border-sky-500 rounded px-1 py-0.5 font-mono-code text-xs text-sky-400 font-medium focus:outline-none shrink-0 mt-0.5';
          keyInput.addEventListener('change', function () {
            const nextK = keyInput.value.trim();
            if (nextK && nextK !== key) {
              if (renameKeyAtPath(state.data, pathArr, nextK)) {
                syncRightToLeft(true);
              }
            } else {
              keyInput.value = String(key);
            }
          });
          row.appendChild(keyInput);
        }

        // 3. Colon ':'
        const colon = document.createElement('span');
        colon.className = 'font-mono-code text-xs text-slate-500 mt-1 shrink-0';
        colon.textContent = ':';
        row.appendChild(colon);

        // 4. Type Select Dropdown (`object ▾`, `string ▾`, etc.)
        const typeSelect = buildTypeSelectDropdown(vType, pathArr, key, val);
        typeSelect.classList.add('mt-0.5');
        row.appendChild(typeSelect);

        // 5. Value Slot or Container Summary
        if (isContainer) {
          const count = isArray ? val.length : Object.keys(val).length;
          const summarySpan = document.createElement('span');
          summarySpan.className = 'font-mono-code text-xs text-slate-400 mt-1 cursor-pointer select-none';
          summarySpan.textContent = isArray
            ? '[ ' + count + (count === 1 ? ' item ]' : ' items ]')
            : '{ ' + count + (count === 1 ? ' key }' : ' keys }');
          summarySpan.addEventListener('click', function () {
            if (state.collapsedPaths.has(pKey)) state.collapsedPaths.delete(pKey);
            else state.collapsedPaths.add(pKey);
            renderTree();
          });
          row.appendChild(summarySpan);

          // Add property / item button
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'opacity-80 group-hover:opacity-100 ml-1 mt-0.5 px-2 py-0.5 rounded bg-[#162032] hover:bg-[#1f2e47] border border-[#2a3650] text-[11px] font-mono-code text-sky-300 transition';
          addBtn.textContent = isArray ? '+ item' : '+ key';
          addBtn.addEventListener('click', function () {
            if (isArray) {
              val.push('');
            } else {
              let idx = Object.keys(val).length + 1;
              while (Object.prototype.hasOwnProperty.call(val, 'new_key_' + idx)) idx++;
              val['new_key_' + idx] = '';
            }
            state.collapsedPaths.delete(pKey);
            syncRightToLeft(true);
          });
          row.appendChild(addBtn);

          if (!isRoot) {
            const delBtn = buildDeleteRowButton(pathArr, key);
            row.appendChild(delBtn);
          }

          wrapper.appendChild(row);

          // Render children inside vertical guide line if expanded
          if (!isCollapsed) {
            const childrenBox = document.createElement('div');
            childrenBox.className = 'tree-children-guide space-y-1 mt-1';
            const entries = Object.entries(val);
            for (let i = 0; i < entries.length; i++) {
              const [cKey, cVal] = entries[i];
              const cPath = pathArr.concat([cKey]);
              const cIsContainer = cVal !== null && typeof cVal === 'object';
              if (!nodeMatchesSearch(cKey, cVal, cPath) && !(cIsContainer && subtreeMatchesSearch(cVal, cPath))) {
                continue;
              }
              childrenBox.appendChild(buildTreeRow(cKey, cVal, cPath, isArray, false));
            }
            wrapper.appendChild(childrenBox);
          }
        } else {
          // Primitive Value Slot (stretches across remaining width just like screenshot)
          const valueSlot = document.createElement('div');
          valueSlot.className = 'flex-1 min-w-0 flex items-start gap-1.5';

          const editorEl = buildLeafValueSlot(key, val, pathArr, ui);
          valueSlot.appendChild(editorEl);

          row.appendChild(valueSlot);
          wrapper.appendChild(row);
        }

        return wrapper;
      }

      function buildDeleteRowButton(pathArr, key) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.title = 'Remove "' + key + '"';
        btn.className = 'opacity-0 group-hover:opacity-100 focus:opacity-100 px-1.5 py-0.5 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-950/40 text-xs font-mono-code transition shrink-0 mt-0.5';
        btn.textContent = '×';
        btn.addEventListener('click', function () {
          deleteAtPath(state.data, pathArr);
          syncRightToLeft(true);
        });
        return btn;
      }

      // =========================================================================
      // 9. LEAF VALUE EDITORS (STRING / HTML CARD / BASE64 CARD / NUMBER / BOOL)
      // =========================================================================
      function buildLeafValueSlot(key, val, pathArr, ui) {
        if (typeof val === 'string') {
          const b64Info = inspectBase64Value(val, key);
          const isB64 = ui.forceMode === 'base64' || (ui.forceMode !== 'plain' && ui.forceMode !== 'html' && b64Info.isBase64);
          const isHtml = !isB64 && (ui.forceMode === 'html' || (ui.forceMode !== 'plain' && isHtmlValue(val)));

          if (isB64) {
            return buildBase64ValueCard(key, val, b64Info, pathArr, ui);
          }
          if (isHtml) {
            return buildHtmlValueCard(val, pathArr, ui, function (newHtml) {
              setValueAtPath(state.data, pathArr, newHtml);
              syncRightToLeft(false);
            }, 'HTML');
          }
          return buildPlainStringTextarea(key, val, pathArr, ui);
        }

        if (typeof val === 'number') {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.step = 'any';
          inp.value = String(val);
          inp.className = 'w-44 bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-amber-300 focus:outline-none';
          inp.addEventListener('input', function () {
            const n = Number(inp.value);
            if (!Number.isNaN(n)) {
              setValueAtPath(state.data, pathArr, n);
              syncRightToLeft(false);
            }
          });
          return inp;
        }

        if (typeof val === 'boolean') {
          const sel = document.createElement('select');
          sel.className = 'bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-emerald-300 focus:outline-none';
          const isPy = getEffectiveOutputFormat() === 'python';
          [true, false].forEach(function (b) {
            const o = document.createElement('option');
            o.value = String(b);
            o.textContent = isPy ? (b ? 'True' : 'False') : (b ? 'true' : 'false');
            if (b === val) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener('change', function () {
            setValueAtPath(state.data, pathArr, sel.value === 'true');
            syncRightToLeft(false);
          });
          return sel;
        }

        // null / None
        const nullBadge = document.createElement('span');
        nullBadge.className = 'inline-block px-2.5 py-1 rounded bg-[#111726] border border-[#263248] font-mono-code text-xs text-slate-400 italic';
        nullBadge.textContent = getEffectiveOutputFormat() === 'python' ? 'None' : 'null';
        return nullBadge;
      }

      /**
       * Plain string resizable textarea (matches screenshot's `to`, `cc`, `from`, `subject`, `messageID`, `webLink` rows)
       */
      function buildPlainStringTextarea(key, strVal, pathArr, ui) {
        const container = document.createElement('div');
        container.className = 'flex-1 min-w-0 flex items-start';

        const ta = document.createElement('textarea');
        const lineCount = strVal.split('\n').length;
        const estimatedRows = lineCount > 1 ? Math.min(4, lineCount) : (strVal.length > 140 ? 3 : (strVal.length > 75 ? 2 : 1));
        ta.rows = estimatedRows;
        ta.spellcheck = false;
        ta.value = strVal;
        ta.className = 'flex-1 w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded px-2.5 py-1 font-mono-code text-xs text-slate-100 leading-snug focus:outline-none resize-y min-h-[28px]';

        ta.addEventListener('input', function () {
          setValueAtPath(state.data, pathArr, ta.value);
          syncRightToLeft(false);
        });

        container.appendChild(ta);
        return container;
      }

      /**
       * Exact HTML Value Card from Screenshot:
       * - Top bar: `HTML` badge on left | `Rendered` (active blue) & `Source` buttons on right
       * - Sub-bar: `[✓] Edit visually` checkbox + `Scripts are disabled in the preview for safety.`
       * - White document canvas below where user can edit visually (`contenteditable`) and sync back to JSON/dict!
       */
      function buildHtmlValueCard(htmlStr, pathArr, ui, onHtmlChanged, badgeLabel) {
        const card = document.createElement('div');
        card.className = 'flex-1 w-full rounded-md border border-[#263248] bg-[#101726] overflow-hidden';

        const activeTab = ui.htmlTab || 'rendered';

        // Header Bar
        const header = document.createElement('div');
        header.className = 'px-2.5 py-1.5 bg-[#141d30] border-b border-[#222d44] flex items-center justify-between gap-2';

        const leftBadges = document.createElement('div');
        leftBadges.className = 'flex items-center gap-2';

        const htmlBadge = document.createElement('span');
        htmlBadge.className = 'px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30 font-mono-code font-bold text-[10.5px] tracking-wide';
        htmlBadge.textContent = badgeLabel || 'HTML';
        leftBadges.appendChild(htmlBadge);

        header.appendChild(leftBadges);

        // Right Toggle: Rendered | Source
        const tabGroup = document.createElement('div');
        tabGroup.className = 'inline-flex items-center rounded bg-[#0d1320] p-0.5 border border-[#263248] text-xs';

        const renderedBtn = document.createElement('button');
        renderedBtn.type = 'button';
        renderedBtn.className = activeTab === 'rendered'
          ? 'px-2.5 py-0.5 rounded bg-sky-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        renderedBtn.textContent = 'Rendered';
        renderedBtn.addEventListener('click', function () {
          ui.htmlTab = 'rendered';
          renderTree();
        });

        const sourceBtn = document.createElement('button');
        sourceBtn.type = 'button';
        sourceBtn.className = activeTab === 'source'
          ? 'px-2.5 py-0.5 rounded bg-sky-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        sourceBtn.textContent = 'Source';
        sourceBtn.addEventListener('click', function () {
          ui.htmlTab = 'source';
          renderTree();
        });

        tabGroup.appendChild(renderedBtn);
        tabGroup.appendChild(sourceBtn);
        header.appendChild(tabGroup);
        card.appendChild(header);

        if (activeTab === 'rendered') {
          // Sub-bar with `[✓] Edit visually` checkbox + `Scripts are disabled in the preview for safety.`
          const subBar = document.createElement('div');
          subBar.className = 'px-2.5 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center gap-2.5 text-xs';

          const chkLabel = document.createElement('label');
          chkLabel.className = 'inline-flex items-center gap-1.5 text-slate-200 font-medium cursor-pointer select-none text-[11.5px]';

          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = ui.editVisually !== false;
          chk.className = 'rounded border-slate-600 text-sky-500 focus:ring-0 cursor-pointer';
          chkLabel.appendChild(chk);

          const chkSpan = document.createElement('span');
          chkSpan.textContent = 'Edit visually';
          chkLabel.appendChild(chkSpan);
          subBar.appendChild(chkLabel);

          const safetyNote = document.createElement('span');
          safetyNote.className = 'text-slate-400 text-[11px]';
          safetyNote.textContent = 'Scripts are disabled in the preview for safety.';
          subBar.appendChild(safetyNote);

          card.appendChild(subBar);

          // White Rendered HTML Canvas
          const canvasWrap = document.createElement('div');
          canvasWrap.className = 'p-2.5 bg-[#0d1320]';

          const surface = document.createElement('div');
          surface.className = 'rendered-html-canvas';
          surface.contentEditable = chk.checked ? 'true' : 'false';
          surface.innerHTML = sanitizeHtmlForPreview(htmlStr);

          chk.addEventListener('change', function () {
            ui.editVisually = chk.checked;
            surface.contentEditable = chk.checked ? 'true' : 'false';
            if (chk.checked) surface.focus();
          });

          surface.addEventListener('input', function () {
            onHtmlChanged(surface.innerHTML);
          });

          canvasWrap.appendChild(surface);
          card.appendChild(canvasWrap);
        } else {
          // Source Code Mode
          const srcWrap = document.createElement('div');
          srcWrap.className = 'p-2.5 bg-[#0b0f17]';

          const srcArea = document.createElement('textarea');
          srcArea.rows = 6;
          srcArea.spellcheck = false;
          srcArea.value = htmlStr;
          srcArea.className = 'w-full bg-[#0b0f17] border border-[#263248] focus:border-sky-500 rounded p-2.5 font-mono-code text-xs text-sky-100 leading-relaxed focus:outline-none resize-y';
          srcArea.addEventListener('input', function () {
            onHtmlChanged(srcArea.value);
          });

          srcWrap.appendChild(srcArea);
          card.appendChild(srcWrap);
        }

        return card;
      }

      /**
       * Base64 Value Card:
       * Automatically decodes Base64 strings (`contentBytes`, Base64 HTML, Base64 JSON, or Base64 Images)
       * and lets the user edit the decoded content visually or as text, re-encoding back to Base64 live!
       */
      function buildBase64ValueCard(key, rawVal, b64Info, pathArr, ui) {
        const card = document.createElement('div');
        card.className = 'flex-1 w-full rounded-md border border-emerald-500/35 bg-[#0e1922] overflow-hidden';

        const prefix = b64Info.isBase64 ? b64Info.prefix : '';
        const activeTab = ui.b64Tab || 'decoded';
        const subKind = b64Info.isBase64 ? b64Info.kind.toUpperCase() : 'TEXT';

        // Header Bar
        const header = document.createElement('div');
        header.className = 'px-2.5 py-1.5 bg-[#12222f] border-b border-emerald-500/25 flex flex-wrap items-center justify-between gap-2';

        const leftBadges = document.createElement('div');
        leftBadges.className = 'flex items-center gap-1.5';

        const b64Badge = document.createElement('span');
        b64Badge.className = 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/35 font-mono-code font-bold text-[10.5px] tracking-wide';
        b64Badge.textContent = 'BASE64 • ' + subKind;
        leftBadges.appendChild(b64Badge);

        if (!b64Info.isBase64 || b64Info.kind !== 'image') {
          const syncHint = document.createElement('span');
          syncHint.className = 'text-[11px] text-emerald-200/75 hidden sm:inline';
          syncHint.textContent = 'Edits auto-encode back to Base64';
          leftBadges.appendChild(syncHint);
        }

        header.appendChild(leftBadges);

        // Right Toggle: Decoded | Base64
        const tabGroup = document.createElement('div');
        tabGroup.className = 'inline-flex items-center rounded bg-[#0b131c] p-0.5 border border-emerald-500/30 text-xs';

        const decodedBtn = document.createElement('button');
        decodedBtn.type = 'button';
        decodedBtn.className = activeTab === 'decoded'
          ? 'px-2.5 py-0.5 rounded bg-emerald-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        decodedBtn.textContent = b64Info.kind === 'html' ? 'Decoded HTML' : (b64Info.kind === 'image' ? 'Image Preview' : 'Decoded');
        decodedBtn.addEventListener('click', function () {
          ui.b64Tab = 'decoded';
          renderTree();
        });

        const rawBtn = document.createElement('button');
        rawBtn.type = 'button';
        rawBtn.className = activeTab === 'raw'
          ? 'px-2.5 py-0.5 rounded bg-emerald-500 text-slate-950 font-semibold text-[11.5px] transition'
          : 'px-2.5 py-0.5 rounded text-slate-300 hover:text-white text-[11.5px] transition';
        rawBtn.textContent = 'Base64';
        rawBtn.addEventListener('click', function () {
          ui.b64Tab = 'raw';
          renderTree();
        });

        const plainModeBtn = document.createElement('button');
        plainModeBtn.type = 'button';
        plainModeBtn.title = 'Treat as plain string instead of Base64';
        plainModeBtn.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-slate-200 text-[11px] transition';
        plainModeBtn.textContent = 'Plain';
        plainModeBtn.addEventListener('click', function () {
          ui.forceMode = 'plain';
          renderTree();
        });

        tabGroup.appendChild(decodedBtn);
        tabGroup.appendChild(rawBtn);
        tabGroup.appendChild(plainModeBtn);
        header.appendChild(tabGroup);
        card.appendChild(header);

        // Helper to re-encode edited decoded text back into Base64 and sync to left input
        function updateDecodedContent(newDecodedStr) {
          const encoded = prefix + utf8ToBase64(newDecodedStr);
          setValueAtPath(state.data, pathArr, encoded);
          syncRightToLeft(false);
        }

        if (activeTab === 'raw') {
          const rawBox = document.createElement('div');
          rawBox.className = 'p-2.5 bg-[#0b0f17] space-y-1';
          const rawTa = document.createElement('textarea');
          rawTa.rows = 3;
          rawTa.spellcheck = false;
          rawTa.value = rawVal;
          rawTa.className = 'w-full bg-[#0b0f17] border border-[#263248] focus:border-emerald-500 rounded p-2 font-mono-code text-xs text-slate-200 focus:outline-none resize-y';
          rawTa.addEventListener('input', function () {
            setValueAtPath(state.data, pathArr, rawTa.value.trim());
            syncRightToLeft(false);
          });
          rawBox.appendChild(rawTa);
          card.appendChild(rawBox);
          return card;
        }

        // Decoded View:
        if (b64Info.isBase64 && b64Info.kind === 'image') {
          const imgContainer = document.createElement('div');
          imgContainer.className = 'bg-[#0d1320] flex flex-col';

          // Zoom & dimensions toolbar so detailed scanned documents/forms are 100% readable
          let zoomPct = ui.imgZoomPct || 100;
          const zoomBar = document.createElement('div');
          zoomBar.className = 'px-3 py-1.5 bg-[#0e1525] border-b border-[#1f293d] flex flex-wrap items-center justify-between gap-2 text-xs';

          const dimText = document.createElement('span');
          dimText.className = 'text-slate-400 font-mono-code text-[11px]';
          dimText.textContent = b64Info.mime || 'image';
          zoomBar.appendChild(dimText);

          const zoomCtrls = document.createElement('div');
          zoomCtrls.className = 'flex items-center gap-1.5';

          const zoomOutBtn = document.createElement('button');
          zoomOutBtn.type = 'button';
          zoomOutBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomOutBtn.textContent = '−';

          const zoomValSpan = document.createElement('span');
          zoomValSpan.className = 'font-mono-code text-[11px] text-slate-200 min-w-[42px] text-center';
          zoomValSpan.textContent = zoomPct + '%';

          const zoomInBtn = document.createElement('button');
          zoomInBtn.type = 'button';
          zoomInBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-200 font-mono-code text-xs';
          zoomInBtn.textContent = '+';

          const zoomResetBtn = document.createElement('button');
          zoomResetBtn.type = 'button';
          zoomResetBtn.className = 'px-2 py-0.5 rounded bg-[#1a2234] hover:bg-[#232e46] border border-[#2a3650] text-slate-300 text-[11px]';
          zoomResetBtn.textContent = 'Fit width';

          zoomCtrls.appendChild(zoomOutBtn);
          zoomCtrls.appendChild(zoomValSpan);
          zoomCtrls.appendChild(zoomInBtn);
          zoomCtrls.appendChild(zoomResetBtn);
          zoomBar.appendChild(zoomCtrls);
          imgContainer.appendChild(zoomBar);

          // Full-width, large scrollable viewport for the decoded image
          const imgViewport = document.createElement('div');
          imgViewport.className = 'p-3 overflow-auto max-h-[760px] resize-y bg-[#0b0f17] flex justify-center items-start';

          const imgPreviewWrap = document.createElement('div');
          imgPreviewWrap.className = 'bg-white p-2 rounded border border-slate-300 shadow-lg inline-block transition-all';
          imgPreviewWrap.style.width = zoomPct + '%';

          const img = document.createElement('img');
          img.src = b64Info.imageDataUrl;
          img.alt = 'Decoded Base64 Image';
          img.className = 'w-full h-auto block rounded';
          img.addEventListener('load', function () {
            if (img.naturalWidth && img.naturalHeight) {
              dimText.textContent = (b64Info.mime || 'image') + ' • ' + img.naturalWidth + ' × ' + img.naturalHeight + ' px';
            }
          });

          function applyZoom(nextZoom) {
            zoomPct = Math.min(300, Math.max(25, nextZoom));
            ui.imgZoomPct = zoomPct;
            zoomValSpan.textContent = zoomPct + '%';
            imgPreviewWrap.style.width = zoomPct + '%';
          }

          zoomOutBtn.addEventListener('click', function () {
            applyZoom(zoomPct - 25);
          });
          zoomInBtn.addEventListener('click', function () {
            applyZoom(zoomPct + 25);
          });
          zoomResetBtn.addEventListener('click', function () {
            applyZoom(100);
          });

          imgPreviewWrap.appendChild(img);
          imgViewport.appendChild(imgPreviewWrap);
          imgContainer.appendChild(imgViewport);
          card.appendChild(imgContainer);
        } else if (b64Info.isBase64 && b64Info.kind === 'html') {
          // Base64 that decoded to HTML: embed our visual HTML editor inside!
          const innerHtmlCard = buildHtmlValueCard(
            b64Info.decodedText || '',
            pathArr,
            ui,
            function (updatedHtml) {
              updateDecodedContent(updatedHtml);
            },
            'DECODED HTML'
          );
          innerHtmlCard.className = 'w-full border-0 bg-transparent';
          card.appendChild(innerHtmlCard);
        } else {
          // Decoded Plain Text / CSV / JSON
          let decodedStr = '';
          if (b64Info.isBase64 && typeof b64Info.decodedText === 'string') {
            decodedStr = b64Info.decodedText;
          } else {
            try {
              decodedStr = base64ToUtf8(rawVal);
            } catch (e) {
              decodedStr = rawVal;
            }
          }

          const bodyWrap = document.createElement('div');
          bodyWrap.className = 'p-2.5 bg-[#0b111b] space-y-1.5';

          const ta = document.createElement('textarea');
          const lines = decodedStr.split('\n').length;
          ta.rows = Math.min(14, Math.max(3, lines));
          ta.spellcheck = false;
          ta.value = decodedStr;
          ta.className = 'w-full bg-[#070b12] border border-emerald-500/35 focus:border-emerald-400 rounded px-3 py-2 font-mono-code text-[13px] text-emerald-100 leading-relaxed focus:outline-none resize-y';

          ta.addEventListener('input', function () {
            updateDecodedContent(ta.value);
          });

          bodyWrap.appendChild(ta);
          card.appendChild(bodyWrap);
        }

        return card;
      }

      // =========================================================================
      // 10. TOP BAR & GLOBAL BUTTON WIRING
      // =========================================================================
      function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = 'px-3 py-1.5 rounded-lg bg-[#1e293b] border border-sky-500/40 text-slate-100 text-xs font-medium shadow-lg transition-opacity';
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(function () {
          t.style.opacity = '0';
          setTimeout(function () {
            if (t.parentNode) t.parentNode.removeChild(t);
          }, 250);
        }, 2000);
      }

      rawInputArea.addEventListener('input', function () {
        handleLeftInputChanged(false);
      });

      // When user pastes new JSON/dict into the Input box, capture that pasted payload as the new "original" baseline!
      rawInputArea.addEventListener('paste', function () {
        setTimeout(function () {
          handleLeftInputChanged(true);
          showToast('Captured pasted input as original baseline');
        }, 20);
      });

      // Sample buttons
      document.getElementById('loadSampleBtn').addEventListener('click', function () {
        state.data = JSON.parse(JSON.stringify(SCREENSHOT_SAMPLE_JSON));
        state.detectedInputFormat = 'json';
        state.collapsedPaths.clear();
        state.nodeUiState = {};
        syncRightToLeft(true, true);
        showToast('Loaded sample JSON');
      });

      document.getElementById('samplePythonDictBtn').addEventListener('click', function () {
        rawInputArea.value = SAMPLE_PYTHON_DICT;
        state.collapsedPaths.clear();
        state.nodeUiState = {};
        handleLeftInputChanged(true);
        showToast('Loaded Python dict sample');
      });

      // Open file input
      const openFileInput = document.getElementById('openFileInput');
      openFileInput.addEventListener('change', function () {
        const f = openFileInput.files && openFileInput.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          rawInputArea.value = String(ev.target.result || '');
          state.collapsedPaths.clear();
          state.nodeUiState = {};
          handleLeftInputChanged(true);
          showToast('Opened ' + f.name);
        };
        reader.readAsText(f);
      });

      // Output format dropdown
      outputModeSelect.addEventListener('change', function () {
        state.outputMode = outputModeSelect.value;
        if (state.data !== undefined) {
          syncRightToLeft(true);
        }
      });

      // Indent dropdown
      indentSelect.addEventListener('change', function () {
        state.indentSetting = indentSelect.value;
        if (state.data !== undefined) {
          syncRightToLeft(false);
        }
      });

      // Format button
      document.getElementById('formatRawBtn').addEventListener('click', function () {
        const res = parseJsonOrPythonDict(rawInputArea.value);
        if (res.ok) {
          state.data = res.value;
          state.detectedInputFormat = res.detectedFormat;
          syncRightToLeft(true);
          showToast('Formatted successfully');
        } else {
          updateTopBadgesAndStatus(false, res.error);
        }
      });

      // Copy button
      document.getElementById('copyRawBtn').addEventListener('click', function () {
        const text = rawInputArea.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('Copied to clipboard');
          }).catch(function () {
            rawInputArea.select();
            document.execCommand('copy');
            showToast('Copied to clipboard');
          });
        } else {
          rawInputArea.select();
          document.execCommand('copy');
          showToast('Copied to clipboard');
        }
      });

      // Download button
      document.getElementById('downloadRawBtn').addEventListener('click', function () {
        const ext = getEffectiveOutputFormat() === 'python' ? 'py' : 'json';
        const blob = new Blob([rawInputArea.value], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.' + ext;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded data.' + ext);
      });

      // Clear button
      document.getElementById('clearRawBtn').addEventListener('click', function () {
        state.data = {};
        state.collapsedPaths.clear();
        syncRightToLeft(true);
        showToast('Cleared editor');
      });

      // Auto-repair button
      autoRepairBtn.addEventListener('click', function () {
        const cleaned = rawInputArea.value.trim().replace(/,\s*([}\]])/g, '$1');
        const res = parseJsonOrPythonDict(cleaned);
        if (res.ok) {
          rawInputArea.value = cleaned;
          handleLeftInputChanged();
          showToast('Repaired trailing comma / syntax');
        } else {
          showToast('Could not auto-fix: ' + res.error);
        }
      });

      // Filter keys / values search input
      const searchNodesInput = document.getElementById('searchNodesInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchNodesInput.addEventListener('input', function () {
        state.searchQuery = searchNodesInput.value.trim();
        if (state.searchQuery) clearSearchBtn.classList.remove('hidden');
        else clearSearchBtn.classList.add('hidden');
        renderTree();
      });

      clearSearchBtn.addEventListener('click', function () {
        searchNodesInput.value = '';
        state.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderTree();
      });

      // Expand all / Collapse all
      document.getElementById('expandAllBtn').addEventListener('click', function () {
        state.collapsedPaths.clear();
        renderTree();
      });

      document.getElementById('collapseAllBtn').addEventListener('click', function () {
        function walkCollapse(val, pathArr) {
          if (val && typeof val === 'object') {
            if (pathArr.length > 0) {
              state.collapsedPaths.add(pathKey(pathArr));
            }
            for (const k of Object.keys(val)) {
              walkCollapse(val[k], pathArr.concat([k]));
            }
          }
        }
        walkCollapse(state.data, []);
        renderTree();
      });

      // =========================================================================
      // 11. ADJUSTABLE SPLIT PANE RESIZER & RESET TO ORIGINAL
      // =========================================================================
      const splitWorkspace = document.getElementById('splitWorkspace');
      const leftEditorPane = document.getElementById('leftEditorPane');
      const paneResizer = document.getElementById('paneResizer');
      const resetPaneSplitBtn = document.getElementById('resetPaneSplitBtn');
      const resetOriginalBtn = document.getElementById('resetOriginalBtn');
      const editorWidthSlider = document.getElementById('editorWidthSlider');
      const editorWidthLabel = document.getElementById('editorWidthLabel');

      function applySplitDimensions() {
        const pct = Math.min(80, Math.max(20, state.leftSplitPct));
        leftEditorPane.style.width = pct + '%';
        leftEditorPane.style.flexBasis = pct + '%';
        if (editorWidthSlider) editorWidthSlider.value = String(Math.round(pct));
        if (editorWidthLabel) editorWidthLabel.textContent = Math.round(pct) + '%';

        const splitChanged = Math.abs(pct - DEFAULT_LEFT_SPLIT_PCT) > 0.5;
        if (splitChanged) {
          resetPaneSplitBtn.classList.remove('hidden');
        } else {
          resetPaneSplitBtn.classList.add('hidden');
        }
      }

      function resetSplitLayout() {
        state.leftSplitPct = DEFAULT_LEFT_SPLIT_PCT;
        applySplitDimensions();
      }

      if (editorWidthSlider) {
        editorWidthSlider.addEventListener('input', function () {
          state.leftSplitPct = Number(editorWidthSlider.value) || DEFAULT_LEFT_SPLIT_PCT;
          applySplitDimensions();
        });
      }

      // Mouse & Pointer drag on #paneResizer attached to window for smooth tracking across panes
      let isDraggingSplit = false;

      paneResizer.addEventListener('mousedown', function (e) {
        e.preventDefault();
        isDraggingSplit = true;
        paneResizer.classList.add('is-dragging');
        document.body.classList.add('resizing-col');
      });

      paneResizer.addEventListener('touchstart', function (e) {
        isDraggingSplit = true;
        paneResizer.classList.add('is-dragging');
        document.body.classList.add('resizing-col');
      }, { passive: true });

      window.addEventListener('mousemove', function (e) {
        if (!isDraggingSplit) return;
        const rect = splitWorkspace.getBoundingClientRect();
        if (rect.width <= 0) return;
        const offsetX = e.clientX - rect.left;
        const pct = Math.min(80, Math.max(20, (offsetX / rect.width) * 100));
        state.leftSplitPct = Math.round(pct * 10) / 10;
        applySplitDimensions();
      });

      window.addEventListener('touchmove', function (e) {
        if (!isDraggingSplit || !e.touches || !e.touches[0]) return;
        const rect = splitWorkspace.getBoundingClientRect();
        if (rect.width <= 0) return;
        const offsetX = e.touches[0].clientX - rect.left;
        const pct = Math.min(80, Math.max(20, (offsetX / rect.width) * 100));
        state.leftSplitPct = Math.round(pct * 10) / 10;
        applySplitDimensions();
      }, { passive: true });

      function stopSplitDrag() {
        if (!isDraggingSplit) return;
        isDraggingSplit = false;
        paneResizer.classList.remove('is-dragging');
        document.body.classList.remove('resizing-col');
      }

      window.addEventListener('mouseup', stopSplitDrag);
      window.addEventListener('touchend', stopSplitDrag);

      // Double-click splitter bar to reset split ratio
      paneResizer.addEventListener('dblclick', function () {
        resetSplitLayout();
        showToast('Reset panel split to default');
      });

      resetPaneSplitBtn.addEventListener('click', function () {
        resetSplitLayout();
        showToast('Reset panel split to default');
      });

      window.addEventListener('resize', applySplitDimensions);

      // "Reset to original" button: restores original unedited JSON/dict data AND resets split layout
      resetOriginalBtn.addEventListener('click', function () {
        if (state.originalDataClone !== null) {
          state.data = deepClone(state.originalDataClone);
          state.detectedInputFormat = state.originalFormat || 'json';
          state.outputMode = 'same';
          outputModeSelect.value = 'same';
          state.collapsedPaths.clear();
          state.nodeUiState = {};
          if (state.originalRawText) {
            rawInputArea.value = state.originalRawText;
          } else {
            rawInputArea.value = serializeCurrentData(state.data);
          }
          state.isModifiedFromOriginal = false;
          updateModifiedBadge();
          updateTopBadgesAndStatus(true);
          renderTree();
        }
        resetSplitLayout();
        showToast('Reset data and layout to original');
      });

      // Initialize with the exact screenshot RFQ Email + HTML + Base64 sample
      state.data = JSON.parse(JSON.stringify(SCREENSHOT_SAMPLE_JSON));
      state.detectedInputFormat = 'json';
      applySplitDimensions();
      syncRightToLeft(true, true);
    })();
  </script>
</body>
</html>
